appId: ${APP_ID}
name: Lyntty app relaunch visible-session smoke
tags:
  - reconnect
  - smoke
---
- launchApp
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://10.0.2.2:8081"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "90%,46%"
- extendedWaitUntil:
    visible: "${HISTORY_TITLE}"
    timeout: 120000
- tapOn: "${HISTORY_TITLE}"
- waitForAnimationToEnd
- assertVisible: "${HISTORY_TITLE}"
- assertNotVisible: "Session has been deleted"
- stopApp
- launchApp
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://10.0.2.2:8081"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "90%,46%"
- extendedWaitUntil:
    visible: "${HISTORY_TITLE}"
    timeout: 120000
- assertNotVisible: "Session has been deleted"
