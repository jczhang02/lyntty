appId: ${APP_ID}
name: Lyntty terminal deep link pairing
tags:
  - core
  - pairing
---
- launchApp
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://10.0.2.2:8081"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "90%,46%"
- openLink: "${PAIRING_URL}"
- extendedWaitUntil:
    visible: "Pair Node"
    timeout: 30000
- assertVisible: "End-to-end encrypted"
- tapOn: "Accept Connection"
- extendedWaitUntil:
    visible: "Terminal connected successfully"
    timeout: 60000
