appId: ${APP_ID}
name: Lyntty renders explicit Pi history gap
tags:
  - reliability
  - history-gap
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "R75 Maestro Pi Session"
    timeout: 120000
- tapOn: "R75 Maestro Pi Session"
- scrollUntilVisible:
    element:
      text: "History gap · Some older Pi messages are unavailable on this computer."
    direction: UP
    timeout: 120000
- assertVisible: "History gap · Some older Pi messages are unavailable on this computer."
