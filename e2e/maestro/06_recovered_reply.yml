appId: ${APP_ID}
name: Lyntty recovers latest Pi reply after app restart
tags:
  - reliability
  - app-restart
  - reply-recovery
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "${HISTORY_TITLE}"
    timeout: 120000
- tapOn: "${HISTORY_TITLE}"
- extendedWaitUntil:
    visible: "${PONG}"
    timeout: 120000
- assertNotVisible: "Session has been deleted"
