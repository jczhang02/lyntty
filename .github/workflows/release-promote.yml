name: Promote compatibility release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Candidate channel
        required: true
        type: choice
        options: [preview, stable]
      candidate_run_id:
        description: Successful Compatibility release candidate run ID
        required: true
        type: string
      candidate_tag:
        description: Immutable candidate tag from that run
        required: true
        type: string
      physical_phone_accepted:
        description: Stable only — optional; true only when the exact Candidate APK passed physical Android validation
        required: true
        type: boolean
        default: false
      accepted_android_apk_sha256:
        description: Stable only — required when physical_phone_accepted is true; SHA-256 of that exact Candidate APK
        required: false
        type: string
      immutable_releases_enabled:
        description: Confirm repository immutable Releases are enabled
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: compatibility-promotion-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.channel == 'stable' && 'release-stable' || 'release-preview' }}
    env:
      CHANNEL: ${{ inputs.channel }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      LYNTTY_RELEASE_TRUST_ROOTS: ${{ vars.LYNTTY_RELEASE_TRUST_ROOTS }}
      PHYSICAL_PHONE_ACCEPTED: ${{ inputs.physical_phone_accepted }}
      ACCEPTED_ANDROID_APK_SHA256: ${{ inputs.accepted_android_apk_sha256 }}
      IMMUTABLE_RELEASES_ENABLED: ${{ inputs.immutable_releases_enabled }}
      REPOSITORY_IMMUTABILITY_GATE: ${{ vars.LYNTTY_IMMUTABLE_RELEASES_ENABLED }}
      TAG_RULESET_ID: ${{ inputs.channel == 'stable' && vars.LYNTTY_STABLE_TAG_RULESET_ID || vars.LYNTTY_COMPAT_PREVIEW_TAG_RULESET_ID }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate protected promotion request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == jczhang02 ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "${GITHUB_REF_PROTECTED:-false}" == true ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$IMMUTABLE_RELEASES_ENABLED" == true ]]
          [[ "$REPOSITORY_IMMUTABILITY_GATE" == true ]]
          [[ "$TAG_RULESET_ID" =~ ^[1-9][0-9]*$ ]]
          if [[ "$CHANNEL" == stable ]]; then
            [[ "$CANDIDATE_TAG" =~ ^compat-v[0-9A-Za-z._-]+-s[0-9]+$ ]]
            case "$PHYSICAL_PHONE_ACCEPTED" in
              true) [[ "$ACCEPTED_ANDROID_APK_SHA256" =~ ^[a-f0-9]{64}$ ]] ;;
              false) [[ -z "$ACCEPTED_ANDROID_APK_SHA256" ]] ;;
              *) exit 1 ;;
            esac
            expected_tag_pattern='refs/tags/compat-v*'
          else
            [[ "$CANDIDATE_TAG" =~ ^compat-preview-v[0-9A-Za-z._-]+-s[0-9]+$ ]]
            [[ "$PHYSICAL_PHONE_ACCEPTED" == false ]]
            [[ -z "$ACCEPTED_ANDROID_APK_SHA256" ]]
            expected_tag_pattern='refs/tags/compat-preview-v*'
          fi
          ruleset_json="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$TAG_RULESET_ID")"
          [[ "$(jq -r .target <<< "$ruleset_json")" == tag ]]
          [[ "$(jq -r .enforcement <<< "$ruleset_json")" == active ]]
          [[ "$(jq -r '.bypass_actors | length' <<< "$ruleset_json")" == 0 ]]
          jq -e --arg pattern "$expected_tag_pattern" '.conditions.ref_name == {exclude: [], include: [$pattern]}' <<< "$ruleset_json"
          jq -e '[.rules[].type] | sort == ["deletion", "update"]' <<< "$ruleset_json"
          : "${LYNTTY_RELEASE_TRUST_ROOTS:?protected channel trust roots are required}"
          run="$(gh run view "$CANDIDATE_RUN_ID" --json conclusion,event,headSha,workflowName)"
          jq -e '
            .conclusion == "success"
            and .event == "workflow_dispatch"
            and .workflowName == "Compatibility release candidate"
          ' <<< "$run" >/dev/null
          echo "$run" > "$RUNNER_TEMP/candidate-run.json"
          printf '%s\n' "$LYNTTY_RELEASE_TRUST_ROOTS" > "$RUNNER_TEMP/trust-roots.json"
          jq -e --arg channel "$CHANNEL" '.schemaVersion == 1 and (.roots | length > 0) and all(.roots[]; .channel == $channel)' "$RUNNER_TEMP/trust-roots.json"
          if [[ "$CHANNEL" == stable ]]; then
            [[ "$(jq -S -c . "$RUNNER_TEMP/trust-roots.json")" == "$(jq -S -c . config/release-trust-roots/stable.json)" ]]
          else
            jq -e --slurpfile stable config/release-trust-roots/stable.json \
              '([.roots[].publicKeyBase64] as $preview | [$stable[0].roots[].publicKeyBase64] as $stableKeys | all($preview[]; . as $key | ($stableKeys | index($key) | not)))' \
              "$RUNNER_TEMP/trust-roots.json"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install deterministic verifier dependencies
        run: bun install --frozen-lockfile

      - name: Download exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-candidate-${{ inputs.candidate_tag }}
          path: ${{ runner.temp }}/download
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify candidate attestation, checksums, source, signature, and matrix
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/download/$CANDIDATE_TAG.candidate.tar.gz"
          test -f "$archive"
          candidate_source="$(bun -e 'const x=await Bun.file(process.argv[1]).json();process.stdout.write(x.headSha)' "$RUNNER_TEMP/candidate-run.json")"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --source-digest "$candidate_source"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/unpacked"
          CANDIDATE="$RUNNER_TEMP/unpacked/candidate"
          (cd "$CANDIDATE" && sha256sum -c checksums.txt)
          bun --no-install scripts/release.ts verify \
            --bom "$CANDIDATE/compatibility-bom.json" \
            --signature "$CANDIDATE/compatibility-bom.sig.json" \
            --trust-store "$RUNNER_TEMP/trust-roots.json" \
            --channel "$CHANNEL" > "$RUNNER_TEMP/bom-verification.json"
          predecessor_args=()
          while IFS= read -r file || [[ -n "$file" ]]; do
            [[ -n "$file" ]] || { echo "candidate predecessor path contains a blank record" >&2; exit 1; }
            [[ "$file" =~ ^predecessors/compat(-preview)?-v[0-9A-Za-z._-]+-s[0-9]+/compatibility-bom\.json$ ]] || {
              echo "candidate predecessor path is not portable: $file" >&2
              exit 1
            }
            predecessor="$CANDIDATE/$file"
            [[ -f "$predecessor" ]] || { echo "candidate predecessor is missing: $file" >&2; exit 1; }
            predecessor_args+=(--predecessor "$predecessor")
          done < "$CANDIDATE/predecessor-paths.txt"
          bun --no-install scripts/release.ts verify-history --current "$CANDIDATE/compatibility-bom.json" "${predecessor_args[@]}"
          CANDIDATE="$CANDIDATE" RUN_JSON="$(cat "$RUNNER_TEMP/candidate-run.json")" bun -e '
            const bom=await Bun.file(`${process.env.CANDIDATE}/compatibility-bom.json`).json();
            const run=JSON.parse(process.env.RUN_JSON);
            if (bom.releaseId!==process.env.CANDIDATE_TAG || bom.channel!==process.env.CHANNEL || bom.source.commit!==run.headSha) throw new Error("candidate BOM identity does not match approved run");
          '
          source_sha="$(bun -e 'const b=await Bun.file(process.argv[1]).json();process.stdout.write(b.source.commit)' "$CANDIDATE/compatibility-bom.json")"
          git fetch --no-tags origin main
          [[ "$source_sha" == "$(git rev-parse origin/main)" ]] || { echo 'candidate source is no longer current protected main' >&2; exit 1; }
          if [[ "$CHANNEL" == stable ]]; then
            stable_apk="$CANDIDATE/app/lyntty-stable.apk"
            [[ -f "$stable_apk" ]]
            actual_android_apk_sha256="$(sha256sum "$stable_apk" | awk '{print $1}')"
            if [[ "$PHYSICAL_PHONE_ACCEPTED" == true ]]; then
              [[ "$actual_android_apk_sha256" == "$ACCEPTED_ANDROID_APK_SHA256" ]] || {
                echo 'physical Android acceptance does not bind this exact Stable Candidate APK' >&2
                exit 1
              }
            fi
            echo "android_apk_sha256=$actual_android_apk_sha256" >> "$GITHUB_OUTPUT"
          fi
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Revalidate monotonic channel head under promotion lock
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.verify.outputs.candidate }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == stable ]]; then
            filter='select(.prerelease == false and .draft == false and (.tag_name | startswith("compat-v")))'
          else
            filter='select(.prerelease == true and .draft == false and (.tag_name | startswith("compat-preview-v")))'
          fi
          release_rows="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq ".[] | $filter | [.published_at, .id, .tag_name] | @tsv")"
          expected_tags=()
          if [[ -n "$release_rows" ]]; then
            mapfile -t expected_tags < <(printf '%s\n' "$release_rows" | sort -t$'\t' -k1,1r -k2,2nr | awk -F '\t' 'NR <= 2 { print $3 }')
          fi
          if [[ "$CHANNEL" == stable && "${#expected_tags[@]}" -gt 0 ]]; then
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "${expected_tags[0]}" ]]
          fi
          head_root="$RUNNER_TEMP/channel-head"
          mkdir "$head_root"
          for tag in "${expected_tags[@]}"; do
            dir="$head_root/$tag"; mkdir "$dir"
            gh release download "$tag" -p compatibility-bom.json -p compatibility-bom.sig.json -D "$dir"
            bun --no-install scripts/release.ts verify \
              --bom "$dir/compatibility-bom.json" --signature "$dir/compatibility-bom.sig.json" \
              --trust-store "$RUNNER_TEMP/trust-roots.json" --channel "$CHANNEL" > "$dir/verified.json"
          done
          CANDIDATE="$CANDIDATE" HEAD_ROOT="$head_root" EXPECTED_TAGS="$(printf '%s\n' "${expected_tags[@]}")" bun - <<'BUN'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          const candidate=await Bun.file(`${process.env.CANDIDATE}/compatibility-bom.json`).json();
          const tags=process.env.EXPECTED_TAGS ? process.env.EXPECTED_TAGS.trim().split('\n').filter(Boolean) : [];
          if (candidate.predecessors.length!==tags.length) throw new Error('candidate predecessor count is stale');
          for (let index=0; index<tags.length; index++) {
            const tag=tags[index];
            const reference=candidate.predecessors[index];
            const referencedTag=decodeURIComponent(new URL(reference.bom.url).pathname.split('/')[5] ?? '');
            if (referencedTag!==tag) throw new Error('candidate predecessor chain is stale');
            const bytes=await readFile(`${process.env.HEAD_ROOT}/${tag}/compatibility-bom.json`);
            const digest=createHash('sha256').update(bytes).digest('hex');
            if (reference.bom.sha256!==digest || reference.bom.size!==bytes.byteLength) throw new Error('candidate predecessor bytes do not match current channel head');
          }
          if (tags.length) {
            const head=await Bun.file(`${process.env.HEAD_ROOT}/${tags[0]}/compatibility-bom.json`).json();
            if (candidate.sequence<=head.sequence) throw new Error('candidate sequence does not advance current channel head');
            if (candidate.components.app.android.versionCode<=head.components.app.android.versionCode) throw new Error('candidate Android versionCode does not advance current channel head');
          }
          BUN
          latest_error="$RUNNER_TEMP/latest-release.err"
          if latest_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>"$latest_error")"; then
            current_latest="$(jq -er .tag_name <<< "$latest_json")"
          elif grep -Fq '(HTTP 404)' "$latest_error"; then
            current_latest=none
          else
            cat "$latest_error" >&2
            exit 1
          fi
          echo "current_latest=$current_latest" >> "$GITHUB_OUTPUT"
          echo "channel_head=${expected_tags[0]:-none}" >> "$GITHUB_OUTPUT"

      - name: Install registry promotion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Promote existing Relay OCI bytes by digest
        id: image
        env:
          CANDIDATE: ${{ steps.verify.outputs.candidate }}
        run: |
          set -euo pipefail
          read -r repository digest < <(bun -e '
            const b=await Bun.file(process.argv[1]).json();
            console.log(`${b.components.relay.image.repository} ${b.components.relay.image.digest}`);
          ' "$CANDIDATE/compatibility-bom.json")
          expected_repository="ghcr.io/jczhang02/lyntty-relay-preview"
          [[ "$CHANNEL" == stable ]] && expected_repository="ghcr.io/jczhang02/lyntty-relay"
          [[ "$repository" == "$expected_repository" ]]
          if skopeo inspect "docker://$repository:$CANDIDATE_TAG" >/dev/null 2>&1; then
            remote_digest="sha256:$(skopeo inspect --raw "docker://$repository:$CANDIDATE_TAG" | sha256sum | awk '{print $1}')"
            [[ "$remote_digest" == "$digest" ]] || { echo 'existing candidate image tag has a different digest' >&2; exit 1; }
          else
            skopeo copy --all "oci-archive:$CANDIDATE/relay/lyntty-relay.oci.tar" "docker://$repository:$CANDIDATE_TAG"
            remote_digest="sha256:$(skopeo inspect --raw "docker://$repository:$CANDIDATE_TAG" | sha256sum | awk '{print $1}')"
            [[ "$remote_digest" == "$digest" ]]
          fi
          cosign sign --yes "$repository@$digest"
          docker run --rm "$repository@$digest" version --json > "$RUNNER_TEMP/relay-build-info.json"
          CANDIDATE="$CANDIDATE" bun -e '
            const bom=await Bun.file(`${process.env.CANDIDATE}/compatibility-bom.json`).json();
            const info=await Bun.file(process.argv[1]).json();
            if (info.component!=="lyntty-relay" || info.version!==bom.components.relay.version || info.relaySchema!==bom.components.relay.schema.current || info.minimumRelaySchema!==bom.components.relay.schema.minimum || info.wire.protocolMajor!==bom.components.relay.wire.protocolMajor || info.wire.protocolMinor!==bom.components.relay.wire.protocolMinor) throw new Error("Relay runtime identity does not match Compatibility BOM");
          ' "$RUNNER_TEMP/relay-build-info.json"
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-promote.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$repository@$digest" >/dev/null
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest Relay image provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest Relay image SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ steps.verify.outputs.candidate }}/evidence/relay.spdx.json
          push-to-registry: true

      - name: Prepare exact release assets
        id: assets
        env:
          CANDIDATE: ${{ steps.verify.outputs.candidate }}
          ANDROID_APK_SHA256: ${{ steps.verify.outputs.android_apk_sha256 }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          mkdir "$assets"
          cp "$CANDIDATE/compatibility-bom.json" "$CANDIDATE/compatibility-bom.sig.json" \
            "$CANDIDATE/compatibility-matrix.json" "$CANDIDATE/bom-verification.json" "$assets/"
          cp "$CANDIDATE/app/"*.apk "$assets/"
          cp "$CANDIDATE/cli/"*.tar.gz "$CANDIDATE/cli/"*.zip "$CANDIDATE/cli/"*.manifest.sha256 "$assets/"
          cp "$CANDIDATE/evidence/"*.spdx.json "$CANDIDATE/evidence/"*.intoto.json \
            "$CANDIDATE/evidence/android-exec-audit.txt" "$CANDIDATE/evidence/android-apk-audit.txt" \
            "$CANDIDATE/evidence/cli-self-check.json" "$CANDIDATE/evidence/relay-build-info.json" \
            "$CANDIDATE/evidence/relay-schema-doctor.json" "$CANDIDATE/evidence/relay-oci-platforms.json" \
            "$CANDIDATE/evidence/retained-runtime-verification.json" "$assets/"
          if compgen -G "$CANDIDATE/evidence/native-*-attestation.json" >/dev/null; then
            cp "$CANDIDATE/evidence/"native-*-attestation.json "$assets/"
          fi
          if [[ "$CHANNEL" == stable ]]; then
            committed_roots=config/release-trust-roots/stable.json
            [[ -f "$committed_roots" ]]
            TRUST_ENV="$LYNTTY_RELEASE_TRUST_ROOTS" TRUST_FILE="$committed_roots" bun -e '
              const configured=JSON.stringify(JSON.parse(process.env.TRUST_ENV));
              const committed=JSON.stringify(await Bun.file(process.env.TRUST_FILE).json());
              if(configured!==committed)throw new Error("Stable environment trust roots do not match protected source");
            '
            cp packages/lyntty-cli/install/install.sh "$assets/install.sh"
            cp "$committed_roots" "$assets/stable-release-trust-roots.json"
            cp "$CANDIDATE/evidence/android-production-guard.txt" "$assets/"
            bun scripts/stable-release-validation.ts audit --output "$assets/android-validation.json"
            chmod 755 "$assets/install.sh"
            (cd "$assets" && sha256sum install.sh > install.sh.sha256)
          fi
          (cd "$assets" && sha256sum * | sort -k2 > release-checksums.txt)
          echo "path=$assets" >> "$GITHUB_OUTPUT"

      - name: Attest released files
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ${{ steps.assets.outputs.path }}/**

      - name: Attest Android SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ${{ steps.assets.outputs.path }}/*.apk
          sbom-path: ${{ steps.assets.outputs.path }}/app.spdx.json

      - name: Attest CLI SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ${{ steps.assets.outputs.path }}/lyntty-cli-*
          sbom-path: ${{ steps.assets.outputs.path }}/cli.spdx.json

      - name: Publish exact immutable Release-ID transaction
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ steps.assets.outputs.path }}
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          CURRENT_LATEST: ${{ steps.head.outputs.current_latest }}
          EXPECTED_CHANNEL_HEAD: ${{ steps.head.outputs.channel_head }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == jczhang02 ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "${GITHUB_REF_PROTECTED:-false}" == true ]]
          if [[ "$CHANNEL" == stable ]]; then
            filter='select(.prerelease == false and .draft == false and (.tag_name | startswith("compat-v")))'
            prerelease=false
            latest=true
          else
            filter='select(.prerelease == true and .draft == false and (.tag_name | startswith("compat-preview-v")))'
            prerelease=true
            latest=false
          fi
          release_rows="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq ".[] | $filter | [.published_at, .id, .tag_name] | @tsv")"
          current_channel_head=none
          if [[ -n "$release_rows" ]]; then
            current_channel_head="$(printf '%s\n' "$release_rows" | sort -t$'\t' -k1,1r -k2,2nr | awk -F '\t' 'NR == 1 { print $3 }')"
          fi
          [[ "$current_channel_head" == "$EXPECTED_CHANNEL_HEAD" ]]
          mapfile -t files < <(find "$ASSETS" -maxdepth 1 -type f -print | sort)
          [[ "${#files[@]}" -gt 0 ]]
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "# Lyntty Compatibility release $CANDIDATE_TAG"
            echo
            echo "Channel: \`$CHANNEL\`"
            echo "Sequence: \`$(jq -r .sequence "$ASSETS/compatibility-bom.json")\`"
            echo "Source: \`$SOURCE_SHA\`"
            echo "Candidate run: \`$CANDIDATE_RUN_ID\`"
            echo "Relay: \`${{ steps.image.outputs.repository }}@${{ steps.image.outputs.digest }}\`"
            if [[ "$CHANNEL" == stable ]]; then
              if [[ "$PHYSICAL_PHONE_ACCEPTED" == true ]]; then
                echo "Physical Android validation: accepted for APK SHA-256 \`$ACCEPTED_ANDROID_APK_SHA256\`"
              fi
              echo 'macOS and Windows CLI archives: intentionally not platform code-signed for this owner-operated self-use release.'
            fi
            echo
            if [[ "$CHANNEL" == stable ]]; then
              echo 'Verify assets with `gh attestation verify <asset> --repo jczhang02/lyntty` and verify the detached Compatibility BOM signature against `stable-release-trust-roots.json`.'
            else
              echo 'Verify assets with `gh attestation verify <asset> --repo jczhang02/lyntty` and verify the detached Compatibility BOM signature against the separately configured Preview trust roots.'
            fi
          } > "$notes"
          audit="$RUNNER_TEMP/release-publication-audit.json"
          result="$(bun scripts/github-release.ts publish \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$CANDIDATE_TAG" \
            --title "Lyntty $CHANNEL $CANDIDATE_TAG" \
            --target "$SOURCE_SHA" \
            --body "$notes" \
            --prerelease "$prerelease" \
            --latest "$latest" \
            --audit "$audit" \
            --required-actor jczhang02 \
            --expected-current-latest "$CURRENT_LATEST" \
            -- "${files[@]}")"
          jq -e --arg tag "$CANDIDATE_TAG" --arg target "$SOURCE_SHA" \
            '.tag == $tag and .target == $target and (.releaseId | type == "number")' <<< "$result"
          echo "audit=$audit" >> "$GITHUB_OUTPUT"
          {
            echo '### Compatibility publication transaction'
            echo "- Tag: \`$CANDIDATE_TAG\`"
            echo "- Target: \`$SOURCE_SHA\`"
            echo "- Release ID: \`$(jq -r .releaseId <<< "$result")\`"
            echo "- Publication occurred: \`$(jq -r .publicationOccurred <<< "$result")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve publication audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-publication-audit-${{ inputs.candidate_tag }}
          path: ${{ steps.publish.outputs.audit }}
          if-no-files-found: error
          retention-days: 90

      - name: Verify published channel cannot cross-contaminate latest
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ steps.assets.outputs.path }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == stable ]]; then
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            [[ "$latest_tag" == "$CANDIDATE_TAG" ]]
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/compatibility-bom.json" \
              | cmp - "$ASSETS/compatibility-bom.json"
          else
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            [[ "$latest_tag" != "$CANDIDATE_TAG" ]]
            [[ "$latest_tag" != compat-preview-* ]]
          fi
