          [[ ! -f deployed-sequence.txt ]] || deployed_sequence="$(cat deployed-sequence.txt)"
          [[ "$deployed_sequence" =~ ^[0-9]+$ ]]
          if (( BOM_SEQUENCE == deployed_sequence )); then
            grep -Fqx "$BOM_TAG $IMAGE_REFERENCE" deployed-bom.txt
            verify_running_release
            echo 'requested Stable BOM is already healthy, exact, and deployed'
            exit 0
          fi
          (( BOM_SEQUENCE > deployed_sequence )) || { echo 'requested Stable BOM sequence is older than the deployed sequence' >&2; exit 1; }
          preflight_phase=prior-runtime-verification
          previous_reference="$(sed -n 's/^LYNTTY_RELAY_IMAGE=//p' .env | tail -1)"
          [[ "$previous_reference" =~ ^ghcr\.io/jczhang02/lyntty-relay@sha256:[a-f0-9]{64}$ ]] || {
