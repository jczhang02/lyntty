                [[ "$(sed -n "s/^${legacy_tag_key}=//p" .env)" == sha-9752c689c927 ]]
              fi
              [[ "$backup_mount_count" == 1 ]] || { echo 'canonical Relay Compose requires the persistent backup mount' >&2; return 1; }
              [[ "$configured_reference" =~ ^ghcr\.io/jczhang02/lyntty-relay@sha256:[a-f0-9]{64}$ ]] || {
                echo 'canonical Relay Compose did not resolve an exact repository digest' >&2
                return 1
              }
              unset rendered_json
              return 0
            fi
            if [[ "$raw_reference" == 'ghcr.io/jczhang02/lyntty-relay:${LYNTTY_RELAY_IMAGE_TAG}' ]]; then
              source_form=legacy-compose-tag-variable
              [[ "$legacy_tag_assignment_count" == 1 && "$legacy_tag_canonical_count" == 1 ]]
              [[ "$(sed -n "s/^${legacy_tag_key}=//p" .env)" == sha-9752c689c927 ]]
            elif [[ "$raw_reference" == "$expected_tag" ]]; then
              source_form=legacy-compose-hardcoded-tag
              [[ "$legacy_tag_assignment_count" == 0 || "$legacy_tag_assignment_count" == 1 && "$legacy_tag_canonical_count" == 1 ]] || return 1
              if [[ "$legacy_tag_assignment_count" == 1 ]]; then
                [[ "$(sed -n "s/^${legacy_tag_key}=//p" .env)" == sha-9752c689c927 ]]
              fi
            else
              echo 'legacy Relay Compose image is not the documented R65 source tag' >&2
              return 1
            fi
            [[ "$configured_reference" == "$expected_tag" ]] || {
              echo 'rendered Relay image differs from the documented R65 source tag' >&2
              return 1
            }
            unset rendered_json
            [[ "$assignment_count" == 0 || "$assignment_count" == 1 && "$canonical_count" == 1 ]] || {
              echo 'legacy Relay image migration requires an absent or one canonical target assignment' >&2
              return 1
            }
            mapfile -t legacy_containers < <(compose ps -q lyntty-relay)
            [[ "${#legacy_containers[@]}" == 1 ]]
            container="${legacy_containers[0]}"
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]
            container_reference="$(docker inspect --format '{{.Config.Image}}' "$container")"
            [[ "$container_reference" == "$expected_tag" ]]
            container_image_id="$(docker inspect --format '{{.Image}}' "$container")"
            [[ "$container_image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
            configured_image_id="$(docker image inspect --format '{{.Id}}' "$configured_reference")"
            [[ "$configured_image_id" == "$container_image_id" ]]
            repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' "$container_image_id")"
            jq -e 'type == "array" and length == 1' <<< "$repo_digests" >/dev/null
            previous_reference="$(jq -er '.[0]' <<< "$repo_digests")"
            [[ "$previous_reference" =~ ^ghcr\.io/jczhang02/lyntty-relay@sha256:[a-f0-9]{64}$ ]]
            repo_tags="$(docker image inspect --format '{{json .RepoTags}}' "$container_image_id")"
            jq -e --arg expected "$expected_tag" \
              'type == "array" and length >= 1 and index($expected) != null and all(.[]; test("^ghcr\\.io/jczhang02/lyntty-relay:[0-9A-Za-z._-]+$"))' \
              <<< "$repo_tags" >/dev/null
            docker pull "$previous_reference" >/dev/null
            previous_image_id="$(docker image inspect --format '{{.Id}}' "$previous_reference")"
            [[ "$previous_image_id" == "$container_image_id" ]]
            if [[ "$assignment_count" == 1 ]]; then
              env_value="$(sed -n "s/^${target_key}=//p" .env)"
              [[ "$env_value" == "$previous_reference" ]] || {
                echo 'interrupted legacy Relay image migration has a mismatched target digest' >&2
                return 1
              }
              unset env_value
            fi

            env_backup="$(mktemp -p . ".env-precanonical-${target_key}-XXXXXXXX")"
            compose_backup="$(mktemp -p . ".compose-precanonical-${target_key}-XXXXXXXX")"
            cp --preserve=mode,ownership,timestamps .env "$env_backup"
            cp --preserve=mode,ownership,timestamps docker-compose.yml "$compose_backup"
            chmod 600 "$env_backup" "$compose_backup"
            cmp -s .env "$env_backup"
            cmp -s docker-compose.yml "$compose_backup"

            env_stage="$(mktemp -p . ".env-image-layout-XXXXXXXX")"
            compose_stage="$(mktemp -p . ".compose-image-layout-XXXXXXXX")"
            source_projection="$(mktemp -p . ".compose-source-projection-XXXXXXXX")"
            stage_projection="$(mktemp -p . ".compose-stage-projection-XXXXXXXX")"
            grep -vE "^${target_key}=" .env > "$env_stage"
            printf '%s=%s\n' "$target_key" "$previous_reference" >> "$env_stage"
            grep -vE "^${target_key}=" .env > "$source_projection"
            grep -vE "^${target_key}=" "$env_stage" > "$stage_projection"
            cmp -s "$source_projection" "$stage_projection"
            image_indent="${original_image_line%%image:*}"
            awk -v replacement="${image_indent}image: \${LYNTTY_RELAY_IMAGE}" -v add_backup="$((backup_mount_count == 0 ? 1 : 0))" '
              /^[[:space:]]*image[[:space:]]*:/ { count += 1; print replacement; next }
              /^      - \/opt\/lyntty\/data:\/data$/ { print; if (add_backup == 1) print "      - /opt/lyntty/backups:/backups"; next }
              { print }
              END { if (count != 1) exit 42 }
            ' docker-compose.yml > "$compose_stage"
            grep -vE '^    image:|^      - /opt/lyntty/backups:/backups$' docker-compose.yml > "$source_projection"
            grep -vE '^    image:|^      - /opt/lyntty/backups:/backups$' "$compose_stage" > "$stage_projection"
            cmp -s "$source_projection" "$stage_projection"
            [[ "$(grep -c '^    image: \${LYNTTY_RELAY_IMAGE}$' "$compose_stage" || true)" == 1 ]]
            [[ "$(grep -c '^      - /opt/lyntty/backups:/backups$' "$compose_stage" || true)" == 1 ]]
            [[ "$(grep -Ec "^(${target_key})=" "$env_stage" || true)" == 1 ]]
            [[ "$(grep -Ec "^(${legacy_tag_key})=" "$env_stage" || true)" == "$legacy_tag_assignment_count" ]]
            chown --reference=.env "$env_stage"
            chown --reference=docker-compose.yml "$compose_stage"
            chmod 600 "$env_stage" "$compose_stage"
            staged_json="$(env -u COMPOSE_FILE -u COMPOSE_PATH_SEPARATOR -u COMPOSE_PROJECT_NAME -u COMPOSE_PROFILES -u COMPOSE_ENV_FILES \
              -u LYNTTY_MASTER_SECRET -u HANDY_MASTER_SECRET -u LYNTTY_RELAY_IMAGE \
              docker compose --project-directory /opt/lyntty --project-name lyntty \
              --file "$compose_stage" --env-file "$env_stage" config --format json 2>/dev/null)"
            jq -e --arg image "$previous_reference" \
              '.services | type == "object" and keys == ["lyntty-relay"] and .["lyntty-relay"].image == $image
                and ([ .["lyntty-relay"].volumes[] | select(.target == "/backups" and .type == "bind" and .source == "/opt/lyntty/backups") ] | length) == 1' \
              <<< "$staged_json" >/dev/null
            unset staged_json

            LEGACY_IMAGE_ENV_BACKUP="$env_backup"
            LEGACY_IMAGE_COMPOSE_BACKUP="$compose_backup"
            LEGACY_IMAGE_CONTAINER="$container"
            LEGACY_IMAGE_CONTAINER_ID="$container_image_id"
            LEGACY_IMAGE_EXPECTED_TAG="$expected_tag"
            LEGACY_IMAGE_ENV_STAGE="$env_stage"
            LEGACY_IMAGE_COMPOSE_STAGE="$compose_stage"
            LEGACY_IMAGE_SOURCE_PROJECTION="$source_projection"
            LEGACY_IMAGE_STAGE_PROJECTION="$stage_projection"
            LEGACY_IMAGE_MIGRATION_COMMITTED=false
            rollback_legacy_image_layout() {
              local original_status=$? rollback_failed=false
              trap - EXIT HUP INT TERM
              rm -f "$LEGACY_IMAGE_ENV_STAGE" "$LEGACY_IMAGE_COMPOSE_STAGE" "$LEGACY_IMAGE_SOURCE_PROJECTION" "$LEGACY_IMAGE_STAGE_PROJECTION"
              if [[ "$LEGACY_IMAGE_MIGRATION_COMMITTED" != true ]]; then
                restore_private_backup "$LEGACY_IMAGE_COMPOSE_BACKUP" docker-compose.yml || rollback_failed=true
                restore_private_backup "$LEGACY_IMAGE_ENV_BACKUP" .env || rollback_failed=true
                if [[ "$rollback_failed" == false ]]; then
                  [[ "$(compose config --format json 2>/dev/null | jq -er '.services["lyntty-relay"].image')" == "$LEGACY_IMAGE_EXPECTED_TAG" ]] || rollback_failed=true
                  [[ "$(docker inspect --format '{{.State.Running}} {{.Image}}' "$LEGACY_IMAGE_CONTAINER")" == "true $LEGACY_IMAGE_CONTAINER_ID" ]] || rollback_failed=true
                fi
                if [[ "$rollback_failed" == true ]]; then
                  printf '%s legacy-image-layout-restore-failed\n' "$BOM_TAG" > "$rollback_marker"
                  chmod 600 "$rollback_marker"
                  echo 'legacy Relay image-layout restoration failed; retry is blocked' >&2
                fi
              fi
              if (( original_status != 0 )); then
                printf 'Relay deployment preflight failed during phase=%s\n' "$preflight_phase" >&2
              fi
              exit "$original_status"
            }
            trap rollback_legacy_image_layout EXIT
            trap 'exit 130' HUP INT TERM
            mv -f -- "$env_stage" .env
            LEGACY_IMAGE_ENV_STAGE=
            mv -f -- "$compose_stage" docker-compose.yml
            LEGACY_IMAGE_COMPOSE_STAGE=
            rm -f "$source_projection" "$stage_projection"
            LEGACY_IMAGE_SOURCE_PROJECTION=
            LEGACY_IMAGE_STAGE_PROJECTION=
            [[ "$(stat -c '%U:%a' .env)" == root:600 ]]
            [[ "$(stat -c '%U:%a' docker-compose.yml)" == root:600 ]]
            [[ "$(compose config --format json 2>/dev/null | jq -er '.services["lyntty-relay"].image')" == "$previous_reference" ]]
            compose config --format json 2>/dev/null | jq -e '
              [ .services["lyntty-relay"].volumes[] | select(.target == "/backups" and .type == "bind" and .source == "/opt/lyntty/backups") ] | length == 1
            ' >/dev/null
            [[ "$(docker image inspect --format '{{.Id}}' "$previous_reference")" == "$container_image_id" ]]
            [[ "$(docker inspect --format '{{.State.Running}} {{.Image}}' "$container")" == "true $container_image_id" ]]
            printf '%s key=%s source_form=%s target_form=env-digest compose_backup=%s env_backup=%s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$target_key" "$source_form" "$(basename "$compose_backup")" "$(basename "$env_backup")" \
              >> .env-canonicalization.log
            chmod 600 .env-canonicalization.log
            LEGACY_IMAGE_MIGRATION_COMMITTED=true
            trap - EXIT HUP INT TERM
            unset LEGACY_IMAGE_ENV_BACKUP LEGACY_IMAGE_COMPOSE_BACKUP LEGACY_IMAGE_CONTAINER LEGACY_IMAGE_CONTAINER_ID LEGACY_IMAGE_EXPECTED_TAG
            unset LEGACY_IMAGE_ENV_STAGE LEGACY_IMAGE_COMPOSE_STAGE LEGACY_IMAGE_SOURCE_PROJECTION LEGACY_IMAGE_STAGE_PROJECTION
            unset LEGACY_IMAGE_MIGRATION_COMMITTED
          }
          preflight_phase=master-secret-canonicalization
          canonicalize_required_assignment LYNTTY_MASTER_SECRET HANDY_MASTER_SECRET
          preflight_phase=legacy-image-layout
          migrate_legacy_relay_image_layout
          trap report_preflight_exit EXIT
          preflight_phase=image-assignment-canonicalization
          canonicalize_required_assignment LYNTTY_RELAY_IMAGE
          preflight_phase=optional-environment-validation
          [[ "$(stat -c '%U:%a' .env)" == root:600 ]]
