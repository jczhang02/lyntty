name: Deploy relay

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy, e.g. sha-<40-character commit>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-relay
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate deploy source
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Relay deploys must run from refs/heads/main"
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "Relay deploy HEAD must equal origin/main"
            exit 1
          fi

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "image_tag must be sha- followed by a full lowercase commit SHA"
            exit 1
          fi

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.LYNTTY_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lyntty_vps
          chmod 600 ~/.ssh/lyntty_vps

      - name: Deploy pinned relay image
        env:
          HOST: ${{ secrets.LYNTTY_VPS_HOST }}
          USER: ${{ secrets.LYNTTY_VPS_USER }}
          PORT: ${{ secrets.LYNTTY_VPS_PORT }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          : "${HOST:?LYNTTY_VPS_HOST is required}"
          : "${USER:?LYNTTY_VPS_USER is required}"
          port="${PORT:-22}"

          ssh -i ~/.ssh/lyntty_vps \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -p "$port" \
            "$USER@$HOST" \
            "bash -se -- $IMAGE_TAG" <<'REMOTE'
          set -euo pipefail
          IMAGE_TAG="$1"
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "invalid relay image tag" >&2
            exit 1
          fi
          sudo test -f /opt/lyntty/.env
          sudo test -f /opt/lyntty/docker-compose.yml

          if sudo grep -q '^LYNTTY_RELAY_IMAGE_TAG=' /opt/lyntty/.env; then
            sudo sed -i "s/^LYNTTY_RELAY_IMAGE_TAG=.*/LYNTTY_RELAY_IMAGE_TAG=${IMAGE_TAG}/" /opt/lyntty/.env
          else
            printf '\nLYNTTY_RELAY_IMAGE_TAG=%s\n' "$IMAGE_TAG" | sudo tee -a /opt/lyntty/.env >/dev/null
          fi

          sudo sh -c 'cd /opt/lyntty && docker compose pull && docker compose up -d && docker compose ps'
          curl -fsS http://127.0.0.1:3005/health
          curl -fsS https://relay.jczhang.cc/health
          REMOTE
