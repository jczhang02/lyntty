name: Deploy relay from Compatibility BOM

on:
  workflow_dispatch:
    inputs:
      bom_tag:
        description: Signed stable Compatibility release tag
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: compatibility-promotion-stable
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-relay
    timeout-minutes: 20
    env:
      BOM_TAG: ${{ inputs.bom_tag }}
      LYNTTY_RELEASE_TRUST_ROOTS: ${{ vars.LYNTTY_RELEASE_TRUST_ROOTS }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install deterministic verifier dependencies
        run: bun install --frozen-lockfile

      - name: Install cosign verifier
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Verify signed stable BOM and resolve immutable image
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == jczhang02 ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "${GITHUB_REF_PROTECTED:-false}" == true ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]
          [[ "$BOM_TAG" =~ ^compat-v[0-9A-Za-z._-]+-s[0-9]+$ ]]
          : "${LYNTTY_RELEASE_TRUST_ROOTS:?production Relay trust roots are required}"
          release_rows="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq \
            '.[] | select(.prerelease == false and .draft == false and (.tag_name | startswith("compat-v"))) | [.published_at, .id, .tag_name] | @tsv')"
          [[ -n "$release_rows" ]] || { echo 'no current Stable compatibility release exists' >&2; exit 1; }
          current_tag="$(printf '%s\n' "$release_rows" | sort -t$'\t' -k1,1r -k2,2nr | awk -F '\t' 'NR == 1 { print $3 }')"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$current_tag" ]]
          [[ "$BOM_TAG" == "$current_tag" ]] || { echo 'production deploy requires the current signed Stable head; use the rollback workflow first' >&2; exit 1; }
          dir="$RUNNER_TEMP/bom"
          mkdir "$dir"
          gh release download "$BOM_TAG" -p compatibility-bom.json -p compatibility-bom.sig.json -D "$dir"
          printf '%s\n' "$LYNTTY_RELEASE_TRUST_ROOTS" > "$RUNNER_TEMP/configured-trust-roots.json"
          [[ "$(jq -S -c . "$RUNNER_TEMP/configured-trust-roots.json")" == "$(jq -S -c . config/release-trust-roots/stable.json)" ]]
          cp config/release-trust-roots/stable.json "$RUNNER_TEMP/trust-roots.json"
          bun --no-install scripts/release.ts verify --bom "$dir/compatibility-bom.json" --signature "$dir/compatibility-bom.sig.json" \
            --trust-store "$RUNNER_TEMP/trust-roots.json" --channel stable > "$dir/verified.json"
          read -r source relay_source relay_version image sequence apk_url apk_sha256 apk_version_code < <(bun -e '
            const b=await Bun.file(process.argv[1]).json();
            if (b.releaseId!==process.env.BOM_TAG || b.components.relay.image.repository!=="ghcr.io/jczhang02/lyntty-relay") throw new Error("BOM release identity is invalid");
            const apk=b.components.app.android.apk;
            console.log(`${b.source.commit} ${b.components.relay.sourceCommit} ${b.components.relay.version} ${b.components.relay.image.reference} ${b.sequence} ${apk.url} ${apk.sha256} ${b.components.app.android.versionCode}`);
          ' "$dir/compatibility-bom.json")
          [[ "$source" =~ ^[a-f0-9]{40}$ ]]
          [[ "$relay_source" =~ ^[a-f0-9]{40}$ ]]
          [[ "$relay_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$image" =~ ^ghcr\.io/jczhang02/lyntty-relay@sha256:[a-f0-9]{64}$ ]]
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$apk_url" =~ ^https://github\.com/jczhang02/lyntty/releases/download/compat-v[0-9A-Za-z._-]+-s[0-9]+/lyntty-stable\.apk$ ]]
          [[ "$apk_sha256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$apk_version_code" =~ ^[1-9][0-9]*$ ]]
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BOM_TAG")"
          [[ "$(jq -r .draft <<< "$release_json")" == false ]]
          [[ "$(jq -r .prerelease <<< "$release_json")" == false ]]
          [[ "$(jq -r .immutable <<< "$release_json")" == true ]]
          [[ "$(jq -r .target_commitish <<< "$release_json")" == "$source" ]]
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BOM_TAG")"
          [[ "$(jq -r .object.type <<< "$tag_json")" == commit ]]
          [[ "$(jq -r .object.sha <<< "$tag_json")" == "$source" ]]
          git merge-base --is-ancestor "$source" origin/main
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-promote.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image" >/dev/null
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --source-digest "$relay_source" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-promote.yml" >/dev/null
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --source-digest "$relay_source" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-promote.yml" \
            --predicate-type https://spdx.dev/Document/v2.3 >/dev/null
          bom_sha256="$(sha256sum "$dir/compatibility-bom.json" | awk '{print $1}')"
          committed_trust_roots="$(jq -c . config/release-trust-roots/stable.json)"
          trust_roots_sha256="$(printf '%s' "$committed_trust_roots" | sha256sum | awk '{print $1}')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "relay_source=$relay_source" >> "$GITHUB_OUTPUT"
          echo "relay_version=$relay_version" >> "$GITHUB_OUTPUT"
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "bom_sha256=$bom_sha256" >> "$GITHUB_OUTPUT"
          echo "apk_url=$apk_url" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "apk_version_code=$apk_version_code" >> "$GITHUB_OUTPUT"
          echo "trust_roots_sha256=$trust_roots_sha256" >> "$GITHUB_OUTPUT"

      - name: Install pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.LYNTTY_VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LYNTTY_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?LYNTTY_VPS_SSH_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?LYNTTY_VPS_KNOWN_HOSTS is required}"
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lyntty_vps
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lyntty_vps ~/.ssh/known_hosts

      - name: Backup, migrate, doctor, and deploy pinned digest
        env:
          HOST: ${{ secrets.LYNTTY_VPS_HOST }}
          USER: ${{ secrets.LYNTTY_VPS_USER }}
          PORT: ${{ secrets.LYNTTY_VPS_PORT }}
          IMAGE_REFERENCE: ${{ steps.release.outputs.image }}
          BOM_SEQUENCE: ${{ steps.release.outputs.sequence }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source }}
          RELAY_SOURCE_COMMIT: ${{ steps.release.outputs.relay_source }}
          RELAY_VERSION: ${{ steps.release.outputs.relay_version }}
          BOM_SHA256: ${{ steps.release.outputs.bom_sha256 }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_SHA256: ${{ steps.release.outputs.apk_sha256 }}
          APK_VERSION_CODE: ${{ steps.release.outputs.apk_version_code }}
          TRUST_ROOTS_SHA256: ${{ steps.release.outputs.trust_roots_sha256 }}
        run: |
          set -euo pipefail
          : "${HOST:?LYNTTY_VPS_HOST is required}"
          : "${USER:?LYNTTY_VPS_USER is required}"
          [[ "$BOM_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$TRUST_ROOTS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          committed_trust_roots="$(jq -c . config/release-trust-roots/stable.json)"
          [[ "$committed_trust_roots" != *$'\n'* ]]
          [[ "$(printf '%s' "$committed_trust_roots" | sha256sum | awk '{print $1}')" == "$TRUST_ROOTS_SHA256" ]]
          trust_roots_base64="$(printf '%s' "$committed_trust_roots" | base64 -w0)"
          [[ "$trust_roots_base64" =~ ^[A-Za-z0-9+/=]+$ ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]
          port="${PORT:-22}"
          ssh -i ~/.ssh/lyntty_vps -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$port" "$USER@$HOST" \
            "sudo /bin/bash -se -- '$IMAGE_REFERENCE' '$BOM_TAG' '$BOM_SEQUENCE' '$SOURCE_COMMIT' '$trust_roots_base64' '$TRUST_ROOTS_SHA256' '$BOM_SHA256' '$APK_URL' '$APK_SHA256' '$APK_VERSION_CODE' '$RELAY_SOURCE_COMMIT' '$RELAY_VERSION'" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          IMAGE_REFERENCE="$1"
          BOM_TAG="$2"
          BOM_SEQUENCE="$3"
          SOURCE_COMMIT="$4"
          TRUST_ROOTS_BASE64="$5"
          TRUST_ROOTS_SHA256="$6"
          BOM_SHA256="$7"
          APK_URL="$8"
          APK_SHA256="$9"
          APK_VERSION_CODE="${10}"
          RELAY_SOURCE_COMMIT="${11}"
          RELAY_VERSION="${12}"
          preflight_phase=argument-validation
          report_preflight_exit() {
            local status=$?
            trap - EXIT
            if (( status != 0 )); then
              printf 'Relay deployment preflight failed during phase=%s\n' "$preflight_phase" >&2
            fi
            exit "$status"
          }
          trap report_preflight_exit EXIT
          [[ "$IMAGE_REFERENCE" =~ ^ghcr\.io/jczhang02/lyntty-relay@sha256:[a-f0-9]{64}$ ]]
          [[ "$BOM_TAG" =~ ^compat-v[0-9A-Za-z._-]+-s[0-9]+$ ]]
          [[ "$BOM_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TRUST_ROOTS_BASE64" =~ ^[A-Za-z0-9+/=]+$ ]]
          [[ "$TRUST_ROOTS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$BOM_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_URL" =~ ^https://github\.com/jczhang02/lyntty/releases/download/compat-v[0-9A-Za-z._-]+-s[0-9]+/lyntty-stable\.apk$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELAY_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELAY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TRUST_ROOTS="$(printf '%s' "$TRUST_ROOTS_BASE64" | base64 -d)"
          [[ "$TRUST_ROOTS" != *$'\n'* ]]
          [[ "$(printf '%s' "$TRUST_ROOTS" | sha256sum | awk '{print $1}')" == "$TRUST_ROOTS_SHA256" ]]
          command -v jq >/dev/null
          preflight_phase=filesystem-and-marker-validation
          cd /opt/lyntty
          test -f .env
          test -f docker-compose.yml
          test -d /opt/lyntty/backups
          [[ ! -L .env ]]
          [[ ! -L docker-compose.yml ]]
          [[ ! -L /opt/lyntty/backups ]]
          [[ "$(stat -c '%U' /opt/lyntty/backups)" == root ]]
          [[ -w /opt/lyntty/backups ]]
          [[ ! -L .env-canonicalization.log && ( ! -e .env-canonicalization.log || -f .env-canonicalization.log ) ]]
          [[ "$(stat -c '%U:%a' .env)" == root:600 ]]
          [[ "$(stat -c '%U:%a' docker-compose.yml)" == root:600 ]]
          [[ "$(tail -c 1 .env | od -An -t u1 | tr -d ' ')" == 10 ]]
          [[ "$(tail -c 1 docker-compose.yml | od -An -t u1 | tr -d ' ')" == 10 ]]
          incomplete_marker=.migration-incomplete
          rollback_marker=.rollback-incomplete
          [[ ! -e "$incomplete_marker" && ! -L "$incomplete_marker" ]] || { echo 'incomplete Relay migration marker exists; restore/verify explicitly before retrying' >&2; exit 1; }
          [[ ! -e "$rollback_marker" && ! -L "$rollback_marker" ]] || { echo 'incomplete pre-migration rollback marker exists; repair the prior runtime explicitly' >&2; exit 1; }
          compose() {
            env -u COMPOSE_FILE -u COMPOSE_PATH_SEPARATOR -u COMPOSE_PROJECT_NAME -u COMPOSE_PROFILES -u COMPOSE_ENV_FILES \
              -u LYNTTY_MASTER_SECRET -u HANDY_MASTER_SECRET -u LYNTTY_RELAY_IMAGE \
              -u LYNTTY_RELEASE_TRUST_ROOTS -u LYNTTY_STABLE_MINIMUM_BOM_SEQUENCE \
              docker compose --project-directory /opt/lyntty --project-name lyntty \
              --file /opt/lyntty/docker-compose.yml --env-file /opt/lyntty/.env "$@"
          }
          restore_env_backup() {
            local backup="$1" restore_path
            restore_path="$(mktemp -p . .env-restore-XXXXXXXX)"
            if ! cp --preserve=mode,ownership,timestamps "$backup" "$restore_path"; then
              rm -f "$restore_path"
              echo 'could not stage the original Relay .env for restoration' >&2
              return 1
            fi
            if ! chmod 600 "$restore_path" || ! mv -f -- "$restore_path" .env; then
              rm -f "$restore_path"
              echo 'could not atomically restore the original Relay .env' >&2
              return 1
            fi
            cmp -s "$backup" .env
            [[ "$(stat -c '%U:%a' .env)" == root:600 ]]
          }
          canonicalize_required_assignment() {
            local key="$1" legacy_key="${2:-}" assignment_count canonical_count exported_count
            local legacy_assignment_count=0 legacy_canonical_count=0 legacy_exported_count=0
            local source_key="$1" source_form=canonical extract_expression="" transform_expression=""
            local before_value after_value source_remaining=0 backup="" normalized=false normalized_path parsed_value semantic_value
            if LC_ALL=C grep -q $'\357\273\277' .env; then
              echo 'Relay .env must not contain a UTF-8 byte-order mark' >&2
              return 1
            fi
            assignment_count="$(grep -Ec "^[[:space:]]*(export[[:space:]]+)?${key}([[:space:]]*=|[[:space:]]+)" .env || true)"
            canonical_count="$(grep -c "^${key}=" .env || true)"
            exported_count="$(grep -Ec "^[[:space:]]*export[[:space:]]+${key}[[:space:]]*=" .env || true)"
            if [[ -n "$legacy_key" ]]; then
              legacy_assignment_count="$(grep -Ec "^[[:space:]]*(export[[:space:]]+)?${legacy_key}([[:space:]]*=|[[:space:]]+)" .env || true)"
              legacy_canonical_count="$(grep -c "^${legacy_key}=" .env || true)"
              legacy_exported_count="$(grep -Ec "^[[:space:]]*export[[:space:]]+${legacy_key}[[:space:]]*=" .env || true)"
            fi
            if [[ "$assignment_count" == 1 && "$canonical_count" == 1 && "$legacy_assignment_count" == 0 ]]; then
              :
            elif [[ "$assignment_count" == 1 && "$canonical_count" == 0 && "$exported_count" == 1 && "$legacy_assignment_count" == 0 ]]; then
              source_form=export
              extract_expression="s/^[[:space:]]*export[[:space:]]+${key}[[:space:]]*=//p"
              transform_expression="s/^[[:space:]]*export[[:space:]]+${key}[[:space:]]*=/${key}=/"
            elif [[ -n "$legacy_key" && "$assignment_count" == 0 && "$legacy_assignment_count" == 1 && "$legacy_canonical_count" == 1 && "$legacy_exported_count" == 0 ]]; then
              source_key="$legacy_key"
              source_form=legacy
              extract_expression="s/^${legacy_key}=//p"
              transform_expression="s/^${legacy_key}=/${key}=/"
            elif [[ -n "$legacy_key" && "$assignment_count" == 0 && "$legacy_assignment_count" == 1 && "$legacy_canonical_count" == 0 && "$legacy_exported_count" == 1 ]]; then
              source_key="$legacy_key"
              source_form=legacy-export
              extract_expression="s/^[[:space:]]*export[[:space:]]+${legacy_key}[[:space:]]*=//p"
              transform_expression="s/^[[:space:]]*export[[:space:]]+${legacy_key}[[:space:]]*=/${key}=/"
            else
              echo "$key must have exactly one canonical, exported, or unique supported legacy assignment (assignments=$assignment_count canonical=$canonical_count exported=$exported_count legacy_assignments=$legacy_assignment_count legacy_canonical=$legacy_canonical_count legacy_exported=$legacy_exported_count)" >&2
              return 1
            fi
            if [[ "$source_key" != "$key" ]] && ! compose config --format json 2>/dev/null \
              | jq -e --arg key "$key" '.services["lyntty-relay"].environment | has($key) | not' >/dev/null; then
              echo "Docker Compose already resolves $key or could not prove its absence; refusing legacy rename" >&2
              return 1
            fi
            if [[ "$source_form" != canonical ]]; then
              if ! before_value="$(sed -n -E "$extract_expression" .env)"; then
                echo "$key source assignment could not be inspected" >&2
                return 1
              fi
              [[ -n "$before_value" ]] || { echo "$key may not be empty" >&2; return 1; }
              backup="$(mktemp -p . ".env-precanonical-${key}-XXXXXXXX")"
              cp --preserve=mode,ownership,timestamps .env "$backup"
              chmod 600 "$backup"
              normalized_path="$(mktemp -p . ".env-normalized-${key}-XXXXXXXX")"
              chmod 600 "$normalized_path"
              if ! sed -E "$transform_expression" .env > "$normalized_path"; then
                rm -f "$normalized_path"
                echo "$key canonicalization transform failed; original .env was not changed" >&2
                return 1
              fi
              if ! after_value="$(sed -n "s/^${key}=//p" "$normalized_path")"; then
                rm -f "$normalized_path"
                echo "$key canonicalization inspection failed; original .env was not changed" >&2
                return 1
              fi
              if [[ "$source_key" != "$key" ]]; then
                source_remaining="$(grep -Ec "^[[:space:]]*(export[[:space:]]+)?${source_key}([[:space:]]*=|[[:space:]]+)" "$normalized_path" || true)"
              fi
              if [[ -z "$after_value" || "$after_value" != "$before_value" || "$(grep -c "^${key}=" "$normalized_path" || true)" != 1 || "$source_remaining" != 0 ]]; then
                rm -f "$normalized_path"
                echo "$key canonicalization verification failed; original .env was not changed" >&2
                return 1
              fi
              if ! mv -f -- "$normalized_path" .env; then
                rm -f "$normalized_path"
                echo "$key canonicalization could not be installed; original .env was not changed" >&2
                return 1
              fi
              normalized=true
            fi
            unset before_value after_value
            if ! parsed_value="$(compose config --format json 2>/dev/null \
              | jq -er --arg key "$key" '
                  if $key == "LYNTTY_MASTER_SECRET" then .services["lyntty-relay"].environment[$key]
                  elif $key == "LYNTTY_RELAY_IMAGE" then .services["lyntty-relay"].image
                  else empty
                  end
                ')"; then
              if [[ "$normalized" == true ]]; then
                restore_env_backup "$backup"
              fi
              echo "Docker Compose could not resolve the deployed $key value from .env" >&2
              return 1
            fi
            semantic_value="$(sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//' <<< "$parsed_value")"
            unset parsed_value
            if [[ -z "$semantic_value" || "$semantic_value" == \#* ]]; then
              if [[ "$normalized" == true ]]; then
                restore_env_backup "$backup"
              fi
              echo "$key resolves to an empty or comment-only deployed value" >&2
              return 1
            fi
            unset semantic_value
            if [[ "$normalized" == true ]]; then
              printf '%s key=%s source_key=%s source_form=%s target_form=canonical backup=%s\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$key" "$source_key" "$source_form" "$(basename "$backup")" >> .env-canonicalization.log
              chmod 600 .env-canonicalization.log
            fi
          }
          restore_private_backup() {
            local backup="$1" target="$2" restore_path
            restore_path="$(mktemp -p . ".$(basename "$target").restore-XXXXXXXX")"
            if ! cp --preserve=mode,ownership,timestamps "$backup" "$restore_path" \
              || ! chmod 600 "$restore_path" \
              || ! mv -f -- "$restore_path" "$target"; then
              rm -f "$restore_path"
              return 1
            fi
            cmp -s "$backup" "$target" || return 1
            [[ "$(stat -c '%U:%a' "$target")" == root:600 ]] || return 1
          }
          migrate_legacy_relay_image_layout() {
            local expected_tag='ghcr.io/jczhang02/lyntty-relay:sha-9752c689c927'
            local target_key=LYNTTY_RELAY_IMAGE legacy_tag_key=LYNTTY_RELAY_IMAGE_TAG source_form
            local assignment_count canonical_count legacy_tag_assignment_count legacy_tag_canonical_count
            local services_key_count service_key_count raw_image_count strict_image_count data_mount_count backup_target_count backup_mount_count
            local rendered_json configured_reference raw_reference container container_reference container_image_id configured_image_id
            local repo_digests repo_tags previous_reference previous_image_id env_value
            local -a legacy_containers=()
            local env_backup compose_backup env_stage compose_stage source_projection stage_projection staged_json image_indent original_image_line
            assignment_count="$(grep -Ec "^[[:space:]]*(export[[:space:]]+)?${target_key}([[:space:]]*=|[[:space:]]+)" .env || true)"
            canonical_count="$(grep -c "^${target_key}=" .env || true)"
            legacy_tag_assignment_count="$(grep -Ec "^[[:space:]]*(export[[:space:]]+)?${legacy_tag_key}([[:space:]]*=|[[:space:]]+)" .env || true)"
            legacy_tag_canonical_count="$(grep -c "^${legacy_tag_key}=" .env || true)"
            if LC_ALL=C grep -q $'\357\273\277\|\r\|\t' docker-compose.yml \
              || [[ "$(wc -c < docker-compose.yml)" != "$(LC_ALL=C tr -d '\000' < docker-compose.yml | wc -c)" ]]; then
              echo 'legacy Relay Compose contains a forbidden BOM, CR, tab, or NUL byte' >&2
              return 1
            fi
            if grep -Eq "\\\\|^[[:space:]]*\\?|(^|[[:space:]])![^[:space:]]|(^|[[:space:]])[&*][A-Za-z0-9_-]+|^[[:space:]]*<<[[:space:]]*:|^[[:space:]]*['\"]?(include|extends)['\"]?[[:space:]]*:|^%" docker-compose.yml; then
              echo 'legacy Relay Compose may not use includes, extensions, directives, anchors, aliases, or merges' >&2
              return 1
            fi
            services_key_count="$(grep -Ec "^[[:space:]]*['\"]?services['\"]?[[:space:]]*:" docker-compose.yml || true)"
            service_key_count="$(grep -Ec "^[[:space:]]*['\"]?lyntty-relay['\"]?[[:space:]]*:" docker-compose.yml || true)"
            [[ "$services_key_count" == 1 && "$(grep -c '^services:$' docker-compose.yml || true)" == 1 ]]
            [[ "$service_key_count" == 1 && "$(grep -c '^  lyntty-relay:$' docker-compose.yml || true)" == 1 ]]
            raw_image_count="$(grep -Ec "^[[:space:]]*['\"]?image['\"]?[[:space:]]*:" docker-compose.yml || true)"
            strict_image_count="$(grep -Ec '^    image: [^[:space:]#]+$' docker-compose.yml || true)"
            [[ "$raw_image_count" == 1 && "$strict_image_count" == 1 ]] || {
              echo 'legacy Relay Compose must contain exactly one canonical image scalar' >&2
              return 1
            }
            data_mount_count="$(grep -c '^      - /opt/lyntty/data:/data$' docker-compose.yml || true)"
            backup_target_count="$(grep -Ec '^[[:space:]]*-[[:space:]]*[^#[:space:]]+:/backups([[:space:]]|$)' docker-compose.yml || true)"
            backup_mount_count="$(grep -c '^      - /opt/lyntty/backups:/backups$' docker-compose.yml || true)"
            [[ "$data_mount_count" == 1 ]]
            [[ "$backup_target_count" == "$backup_mount_count" && "$backup_mount_count" -le 1 ]] || {
              echo 'Relay Compose has an ambiguous /backups mount' >&2
              return 1
            }
            original_image_line="$(grep -E '^    image: [^[:space:]#]+$' docker-compose.yml)"
            raw_reference="${original_image_line#    image: }"
            if ! rendered_json="$(compose config --format json 2>/dev/null)"; then
              echo 'legacy Relay Compose could not be rendered' >&2
              return 1
            fi
            jq -e '.services | type == "object" and keys == ["lyntty-relay"]' <<< "$rendered_json" >/dev/null
            configured_reference="$(jq -er '.services["lyntty-relay"].image' <<< "$rendered_json")"
            jq -e --argjson backups "$backup_mount_count" '
                .services["lyntty-relay"].volumes as $volumes
                | ([ $volumes[] | select(.type == "bind" and .source == "/opt/lyntty/data" and .target == "/data") ] | length) == 1
                  and ([ $volumes[] | select(.target == "/backups") ] | length) == $backups
                  and ([ $volumes[] | select(.target == "/backups" and .type == "bind" and .source == "/opt/lyntty/backups") ] | length) == $backups
              ' <<< "$rendered_json" >/dev/null
            if [[ "$raw_reference" == '${LYNTTY_RELAY_IMAGE}' ]]; then
              [[ "$assignment_count" == 1 ]] || { echo 'canonical Relay Compose requires exactly one image assignment' >&2; return 1; }
              [[ "$legacy_tag_assignment_count" == 0 || "$legacy_tag_assignment_count" == 1 && "$legacy_tag_canonical_count" == 1 ]] || {
                echo 'canonical Relay Compose has an invalid legacy image-tag retry state' >&2
                return 1
