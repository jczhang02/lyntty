          [[ "$(grep -c '^LYNTTY_RELAY_IMAGE=' .env || true)" == 1 ]]
          [[ "$(grep -c '^LYNTTY_RELEASE_TRUST_ROOTS=' .env || true)" -le 1 ]]
          [[ "$(grep -c '^LYNTTY_STABLE_MINIMUM_BOM_SEQUENCE=' .env || true)" -le 1 ]]
          unset master_secret
          verify_image_identity() {
            local revision version_json
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REFERENCE")"
            [[ "$revision" == "$RELAY_SOURCE_COMMIT" ]]
            version_json="$(docker run --rm "$IMAGE_REFERENCE" version --json)"
            jq -e --arg version "$RELAY_VERSION" '.component == "lyntty-relay" and .version == $version' <<< "$version_json" >/dev/null
          }
          verify_running_release() {
            local container configured_image response
            verify_image_identity
            configured_image="$(compose config --images | grep -Fx "$IMAGE_REFERENCE" | wc -l)"
            [[ "$configured_image" == 1 ]]
            container="$(compose ps -q lyntty-relay)"
            [[ -n "$container" ]]
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]
            [[ "$(docker inspect --format '{{.Config.Image}}' "$container")" == "$IMAGE_REFERENCE" ]]
            [[ "$(sed -n 's/^LYNTTY_RELEASE_TRUST_ROOTS=//p' .env | tail -1)" == "$TRUST_ROOTS" ]]
            [[ "$(sed -n 's/^LYNTTY_STABLE_MINIMUM_BOM_SEQUENCE=//p' .env | tail -1)" == "$BOM_SEQUENCE" ]]
            curl -fsS http://127.0.0.1:3005/health >/dev/null
            response="$(curl -fsS -X POST http://127.0.0.1:3005/v1/version \
              -H 'Content-Type: application/json' \
              --data '{"platform":"android","version":"0.0.0","version_code":0,"app_id":"dev.jczhang.lyntty","release_channel":"stable"}')"
            jq -e --arg release "$BOM_TAG" --arg url "$APK_URL" --arg sha "$APK_SHA256" \
              --arg bom_sha "$BOM_SHA256" --argjson sequence "$BOM_SEQUENCE" --argjson code "$APK_VERSION_CODE" \
              '.update_required == true and .release_channel == "stable" and .bom_release_id == $release and .bom_sequence == $sequence and .bom_sha256 == $bom_sha and .version_code == $code and .apk_url == $url and .sha256 == $sha' \
              <<< "$response" >/dev/null
          }
          verify_previous_runtime() {
            local container configured_image container_reference container_image_id reference_image_id
            configured_image="$(compose config --images | grep -Fx "$previous_reference" | wc -l)" || return 1
            [[ "$configured_image" == 1 ]] || return 1
            container="$(compose ps -q lyntty-relay)" || return 1
            [[ -n "$container" ]] || return 1
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]] || return 1
            container_reference="$(docker inspect --format '{{.Config.Image}}' "$container")" || return 1
            [[ "$container_reference" == "$previous_reference" || "$container_reference" == ghcr.io/jczhang02/lyntty-relay:sha-9752c689c927 ]] || return 1
            container_image_id="$(docker inspect --format '{{.Image}}' "$container")" || return 1
            reference_image_id="$(docker image inspect --format '{{.Id}}' "$previous_reference")" || return 1
            [[ "$container_image_id" == "$reference_image_id" ]] || return 1
            curl -fsS http://127.0.0.1:3005/health >/dev/null || return 1
          }
