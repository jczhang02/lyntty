name: Deploy relay from Compatibility BOM

on:
  workflow_dispatch:
    inputs:
      bom_tag:
        description: Signed stable Compatibility release tag
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: compatibility-promotion-stable
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-relay
    timeout-minutes: 20
    env:
      BOM_TAG: ${{ inputs.bom_tag }}
      LYNTTY_RELEASE_TRUST_ROOTS: ${{ vars.LYNTTY_RELEASE_TRUST_ROOTS }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install deterministic verifier dependencies
        run: bun install --frozen-lockfile

      - name: Install cosign verifier
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Verify signed stable BOM and resolve immutable image
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == jczhang02 ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "${GITHUB_REF_PROTECTED:-false}" == true ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]
          [[ "$BOM_TAG" =~ ^compat-v[0-9A-Za-z._-]+-s[0-9]+$ ]]
          : "${LYNTTY_RELEASE_TRUST_ROOTS:?production Relay trust roots are required}"
          release_rows="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq \
            '.[] | select(.prerelease == false and .draft == false and (.tag_name | startswith("compat-v"))) | [.published_at, .id, .tag_name] | @tsv')"
          [[ -n "$release_rows" ]] || { echo 'no current Stable compatibility release exists' >&2; exit 1; }
          current_tag="$(printf '%s\n' "$release_rows" | sort -t$'\t' -k1,1r -k2,2nr | awk -F '\t' 'NR == 1 { print $3 }')"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$current_tag" ]]
          [[ "$BOM_TAG" == "$current_tag" ]] || { echo 'production deploy requires the current signed Stable head; use the rollback workflow first' >&2; exit 1; }
          dir="$RUNNER_TEMP/bom"
          mkdir "$dir"
          gh release download "$BOM_TAG" -p compatibility-bom.json -p compatibility-bom.sig.json -D "$dir"
          printf '%s\n' "$LYNTTY_RELEASE_TRUST_ROOTS" > "$RUNNER_TEMP/configured-trust-roots.json"
          [[ "$(jq -S -c . "$RUNNER_TEMP/configured-trust-roots.json")" == "$(jq -S -c . config/release-trust-roots/stable.json)" ]]
          cp config/release-trust-roots/stable.json "$RUNNER_TEMP/trust-roots.json"
          bun --no-install scripts/release.ts verify --bom "$dir/compatibility-bom.json" --signature "$dir/compatibility-bom.sig.json" \
            --trust-store "$RUNNER_TEMP/trust-roots.json" --channel stable > "$dir/verified.json"
          read -r source relay_source relay_version image sequence apk_url apk_sha256 apk_version_code < <(bun -e '
            const b=await Bun.file(process.argv[1]).json();
            if (b.releaseId!==process.env.BOM_TAG || b.components.relay.image.repository!=="ghcr.io/jczhang02/lyntty-relay") throw new Error("BOM release identity is invalid");
            const apk=b.components.app.android.apk;
            console.log(`${b.source.commit} ${b.components.relay.sourceCommit} ${b.components.relay.version} ${b.components.relay.image.reference} ${b.sequence} ${apk.url} ${apk.sha256} ${b.components.app.android.versionCode}`);
          ' "$dir/compatibility-bom.json")
          [[ "$source" =~ ^[a-f0-9]{40}$ ]]
          [[ "$relay_source" =~ ^[a-f0-9]{40}$ ]]
          [[ "$relay_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$image" =~ ^ghcr\.io/jczhang02/lyntty-relay@sha256:[a-f0-9]{64}$ ]]
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$apk_url" =~ ^https://github\.com/jczhang02/lyntty/releases/download/compat-v[0-9A-Za-z._-]+-s[0-9]+/lyntty-stable\.apk$ ]]
          [[ "$apk_sha256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$apk_version_code" =~ ^[1-9][0-9]*$ ]]
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BOM_TAG")"
          [[ "$(jq -r .draft <<< "$release_json")" == false ]]
          [[ "$(jq -r .prerelease <<< "$release_json")" == false ]]
          [[ "$(jq -r .immutable <<< "$release_json")" == true ]]
          [[ "$(jq -r .target_commitish <<< "$release_json")" == "$source" ]]
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BOM_TAG")"
          [[ "$(jq -r .object.type <<< "$tag_json")" == commit ]]
          [[ "$(jq -r .object.sha <<< "$tag_json")" == "$source" ]]
          git merge-base --is-ancestor "$source" origin/main
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-promote.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image" >/dev/null
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --source-digest "$relay_source" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-promote.yml" >/dev/null
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --source-digest "$relay_source" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-promote.yml" \
            --predicate-type https://spdx.dev/Document/v2.3 >/dev/null
          bom_sha256="$(sha256sum "$dir/compatibility-bom.json" | awk '{print $1}')"
          committed_trust_roots="$(jq -c . config/release-trust-roots/stable.json)"
          trust_roots_sha256="$(printf '%s' "$committed_trust_roots" | sha256sum | awk '{print $1}')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "relay_source=$relay_source" >> "$GITHUB_OUTPUT"
          echo "relay_version=$relay_version" >> "$GITHUB_OUTPUT"
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "bom_sha256=$bom_sha256" >> "$GITHUB_OUTPUT"
          echo "apk_url=$apk_url" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "apk_version_code=$apk_version_code" >> "$GITHUB_OUTPUT"
          echo "trust_roots_sha256=$trust_roots_sha256" >> "$GITHUB_OUTPUT"

      - name: Install pinned SSH trust
        env:
          SSH_KEY: ${{ secrets.LYNTTY_VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LYNTTY_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?LYNTTY_VPS_SSH_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?LYNTTY_VPS_KNOWN_HOSTS is required}"
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lyntty_vps
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lyntty_vps ~/.ssh/known_hosts

      - name: Backup, migrate, doctor, and deploy pinned digest
        env:
          HOST: ${{ secrets.LYNTTY_VPS_HOST }}
          USER: ${{ secrets.LYNTTY_VPS_USER }}
          PORT: ${{ secrets.LYNTTY_VPS_PORT }}
          IMAGE_REFERENCE: ${{ steps.release.outputs.image }}
          BOM_SEQUENCE: ${{ steps.release.outputs.sequence }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source }}
          RELAY_SOURCE_COMMIT: ${{ steps.release.outputs.relay_source }}
          RELAY_VERSION: ${{ steps.release.outputs.relay_version }}
          BOM_SHA256: ${{ steps.release.outputs.bom_sha256 }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_SHA256: ${{ steps.release.outputs.apk_sha256 }}
          APK_VERSION_CODE: ${{ steps.release.outputs.apk_version_code }}
          TRUST_ROOTS_SHA256: ${{ steps.release.outputs.trust_roots_sha256 }}
        run: |
          set -euo pipefail
          : "${HOST:?LYNTTY_VPS_HOST is required}"
          : "${USER:?LYNTTY_VPS_USER is required}"
          [[ "$BOM_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$TRUST_ROOTS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          committed_trust_roots="$(jq -c . config/release-trust-roots/stable.json)"
          [[ "$committed_trust_roots" != *$'\n'* ]]
          [[ "$(printf '%s' "$committed_trust_roots" | sha256sum | awk '{print $1}')" == "$TRUST_ROOTS_SHA256" ]]
          trust_roots_base64="$(printf '%s' "$committed_trust_roots" | base64 -w0)"
          [[ "$trust_roots_base64" =~ ^[A-Za-z0-9+/=]+$ ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]
          port="${PORT:-22}"
          ssh -i ~/.ssh/lyntty_vps -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$port" "$USER@$HOST" \
            "sudo /bin/bash -se -- '$IMAGE_REFERENCE' '$BOM_TAG' '$BOM_SEQUENCE' '$SOURCE_COMMIT' '$trust_roots_base64' '$TRUST_ROOTS_SHA256' '$BOM_SHA256' '$APK_URL' '$APK_SHA256' '$APK_VERSION_CODE' '$RELAY_SOURCE_COMMIT' '$RELAY_VERSION'" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          IMAGE_REFERENCE="$1"
          BOM_TAG="$2"
          BOM_SEQUENCE="$3"
          SOURCE_COMMIT="$4"
          TRUST_ROOTS_BASE64="$5"
          TRUST_ROOTS_SHA256="$6"
          BOM_SHA256="$7"
          APK_URL="$8"
          APK_SHA256="$9"
          APK_VERSION_CODE="${10}"
          RELAY_SOURCE_COMMIT="${11}"
          RELAY_VERSION="${12}"
          [[ "$IMAGE_REFERENCE" =~ ^ghcr\.io/jczhang02/lyntty-relay@sha256:[a-f0-9]{64}$ ]]
          [[ "$BOM_TAG" =~ ^compat-v[0-9A-Za-z._-]+-s[0-9]+$ ]]
          [[ "$BOM_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TRUST_ROOTS_BASE64" =~ ^[A-Za-z0-9+/=]+$ ]]
          [[ "$TRUST_ROOTS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$BOM_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_URL" =~ ^https://github\.com/jczhang02/lyntty/releases/download/compat-v[0-9A-Za-z._-]+-s[0-9]+/lyntty-stable\.apk$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELAY_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELAY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TRUST_ROOTS="$(printf '%s' "$TRUST_ROOTS_BASE64" | base64 -d)"
          [[ "$TRUST_ROOTS" != *$'\n'* ]]
          [[ "$(printf '%s' "$TRUST_ROOTS" | sha256sum | awk '{print $1}')" == "$TRUST_ROOTS_SHA256" ]]
          command -v jq >/dev/null
          cd /opt/lyntty
          test -f .env
          test -f docker-compose.yml
          [[ "$(stat -c '%U:%a' .env)" == root:600 ]]
          for key in LYNTTY_MASTER_SECRET LYNTTY_RELAY_IMAGE LYNTTY_RELEASE_TRUST_ROOTS LYNTTY_STABLE_MINIMUM_BOM_SEQUENCE; do
            assignment_count="$(grep -Ec "^[[:space:]]*(export[[:space:]]+)?${key}([[:space:]]*=|[[:space:]]+)" .env || true)"
            canonical_count="$(grep -c "^${key}=" .env || true)"
            if [[ "$key" == LYNTTY_MASTER_SECRET || "$key" == LYNTTY_RELAY_IMAGE ]]; then
              [[ "$assignment_count" == 1 && "$canonical_count" == 1 ]] || {
                echo "$key must have exactly one canonical, unprefixed assignment" >&2
                exit 1
              }
            else
              [[ "$assignment_count" == "$canonical_count" && "$canonical_count" -le 1 ]] || {
                echo "$key has a duplicate or noncanonical assignment" >&2
                exit 1
              }
            fi
          done
          master_secret="$(sed -n 's/^LYNTTY_MASTER_SECRET=//p' .env)"
          [[ -n "$master_secret" ]] || { echo 'canonical LYNTTY_MASTER_SECRET may not be empty' >&2; exit 1; }
          [[ "$(grep -c '^LYNTTY_RELAY_IMAGE=' .env || true)" == 1 ]]
          [[ "$(grep -c '^LYNTTY_RELEASE_TRUST_ROOTS=' .env || true)" -le 1 ]]
          [[ "$(grep -c '^LYNTTY_STABLE_MINIMUM_BOM_SEQUENCE=' .env || true)" -le 1 ]]
          unset master_secret
          incomplete_marker=.migration-incomplete
          rollback_marker=.rollback-incomplete
          [[ ! -e "$incomplete_marker" ]] || { echo 'incomplete Relay migration marker exists; restore/verify explicitly before retrying' >&2; exit 1; }
          [[ ! -e "$rollback_marker" ]] || { echo 'incomplete pre-migration rollback marker exists; repair the prior runtime explicitly' >&2; exit 1; }
          verify_image_identity() {
            local revision version_json
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REFERENCE")"
            [[ "$revision" == "$RELAY_SOURCE_COMMIT" ]]
            version_json="$(docker run --rm "$IMAGE_REFERENCE" version --json)"
            jq -e --arg version "$RELAY_VERSION" '.component == "lyntty-relay" and .version == $version' <<< "$version_json" >/dev/null
          }
          verify_running_release() {
            local container configured_image response
            verify_image_identity
            configured_image="$(docker compose config --images | grep -Fx "$IMAGE_REFERENCE" | wc -l)"
            [[ "$configured_image" == 1 ]]
            container="$(docker compose ps -q lyntty-relay)"
            [[ -n "$container" ]]
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]
            [[ "$(docker inspect --format '{{.Config.Image}}' "$container")" == "$IMAGE_REFERENCE" ]]
            [[ "$(sed -n 's/^LYNTTY_RELEASE_TRUST_ROOTS=//p' .env | tail -1)" == "$TRUST_ROOTS" ]]
            [[ "$(sed -n 's/^LYNTTY_STABLE_MINIMUM_BOM_SEQUENCE=//p' .env | tail -1)" == "$BOM_SEQUENCE" ]]
            curl -fsS http://127.0.0.1:3005/health >/dev/null
            response="$(curl -fsS -X POST http://127.0.0.1:3005/v1/version \
              -H 'Content-Type: application/json' \
              --data '{"platform":"android","version":"0.0.0","version_code":0,"app_id":"dev.jczhang.lyntty","release_channel":"stable"}')"
            jq -e --arg release "$BOM_TAG" --arg url "$APK_URL" --arg sha "$APK_SHA256" \
              --arg bom_sha "$BOM_SHA256" --argjson sequence "$BOM_SEQUENCE" --argjson code "$APK_VERSION_CODE" \
              '.update_required == true and .release_channel == "stable" and .bom_release_id == $release and .bom_sequence == $sequence and .bom_sha256 == $bom_sha and .version_code == $code and .apk_url == $url and .sha256 == $sha' \
              <<< "$response" >/dev/null
          }
          verify_previous_runtime() {
            local container configured_image
            configured_image="$(docker compose config --images | grep -Fx "$previous_reference" | wc -l)"
            [[ "$configured_image" == 1 ]]
            container="$(docker compose ps -q lyntty-relay)"
            [[ -n "$container" ]]
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]
            [[ "$(docker inspect --format '{{.Config.Image}}' "$container")" == "$previous_reference" ]]
            curl -fsS http://127.0.0.1:3005/health >/dev/null
          }
          deployed_sequence=0
          [[ ! -f deployed-sequence.txt ]] || deployed_sequence="$(cat deployed-sequence.txt)"
          [[ "$deployed_sequence" =~ ^[0-9]+$ ]]
          if (( BOM_SEQUENCE == deployed_sequence )); then
            grep -Fqx "$BOM_TAG $IMAGE_REFERENCE" deployed-bom.txt
            verify_running_release
            echo 'requested Stable BOM is already healthy, exact, and deployed'
            exit 0
          fi
          (( BOM_SEQUENCE > deployed_sequence )) || { echo 'requested Stable BOM sequence is older than the deployed sequence' >&2; exit 1; }
          previous_reference="$(sed -n 's/^LYNTTY_RELAY_IMAGE=//p' .env | tail -1)"
          [[ "$previous_reference" =~ ^ghcr\.io/jczhang02/lyntty-relay@sha256:[a-f0-9]{64}$ ]] || {
            echo 'formal deployment requires the existing Relay to be pinned by digest for pre-migration rollback' >&2
            exit 1
          }
          verify_previous_runtime
          previous_env="$(mktemp /opt/lyntty/.env.predeploy.XXXXXX)"
          cp --preserve=mode,ownership,timestamps .env "$previous_env"
          env_next=
          schema_mutation_started=false
          success=false
          remove_private_file() {
            local path="$1"
            [[ -e "$path" ]] || return 0
            if command -v shred >/dev/null 2>&1; then shred -u "$path"; else rm -f "$path"; fi
          }
          rollback_environment() {
            local original_status=$?
            local rollback_failed=false
            trap - EXIT
            [[ -z "$env_next" ]] || remove_private_file "$env_next"
            if [[ "$success" == true ]]; then
              remove_private_file "$previous_env"
              exit "$original_status"
            fi
            docker compose stop lyntty-relay >/dev/null 2>&1 || true
            if [[ "$schema_mutation_started" == false ]]; then
              if ! mv -f "$previous_env" .env; then rollback_failed=true; fi
              if [[ "$rollback_failed" == false ]]; then
                chmod 600 .env
                docker compose pull lyntty-relay || rollback_failed=true
                docker compose up -d lyntty-relay || rollback_failed=true
                verify_previous_runtime || rollback_failed=true
              fi
              if [[ "$rollback_failed" == true ]]; then
                printf '%s %s pre-migration-restore-failed\n' "$BOM_TAG" "$previous_reference" > "$rollback_marker"
                chmod 600 "$rollback_marker"
                echo 'Pre-migration Relay rollback failed; Relay state is not accepted and .rollback-incomplete blocks retries.' >&2
              fi
            else
              remove_private_file "$previous_env"
              echo 'Relay remains fail-stopped after migration began; verify backup/restore and doctor before any restart.' >&2
            fi
            exit "$original_status"
          }
          trap rollback_environment EXIT
          trap 'exit 130' HUP INT TERM
          docker compose stop lyntty-relay
          env_next="$(mktemp /opt/lyntty/.env.next.XXXXXX)"
          grep -vE '^(LYNTTY_RELAY_IMAGE|LYNTTY_RELEASE_TRUST_ROOTS|LYNTTY_STABLE_MINIMUM_BOM_SEQUENCE)=' .env > "$env_next"
          {
            printf 'LYNTTY_RELAY_IMAGE=%s\n' "$IMAGE_REFERENCE"
            printf 'LYNTTY_RELEASE_TRUST_ROOTS=%s\n' "$TRUST_ROOTS"
            printf 'LYNTTY_STABLE_MINIMUM_BOM_SEQUENCE=%s\n' "$BOM_SEQUENCE"
          } >> "$env_next"
          chown --reference=.env "$env_next"
          chmod 600 "$env_next"
          mv -f "$env_next" .env
          env_next=
          [[ "$(printf '%s' "$(sed -n 's/^LYNTTY_RELEASE_TRUST_ROOTS=//p' .env | tail -1)" | sha256sum | awk '{print $1}')" == "$TRUST_ROOTS_SHA256" ]]
          [[ "$(docker compose config --images | grep -Fx "$IMAGE_REFERENCE" | wc -l)" == 1 ]]
          docker compose pull lyntty-relay
          verify_image_identity
          backup="/backups/predeploy-${BOM_TAG}-$(date -u +%Y%m%dT%H%M%SZ).backup"
          docker compose run --rm -T lyntty-relay backup "$backup" </dev/null
          host_backup="/opt/lyntty${backup}"
          test -s "$host_backup"
          test -s "${host_backup}.sha256"
          (cd "$(dirname "$host_backup")" && sha256sum -c "$(basename "$host_backup").sha256")
          printf '%s %s %s %s\n' "$BOM_TAG" "$BOM_SEQUENCE" "$IMAGE_REFERENCE" "$backup" > "${incomplete_marker}.tmp"
          chmod 600 "${incomplete_marker}.tmp"
          mv "${incomplete_marker}.tmp" "$incomplete_marker"
          schema_mutation_started=true
          docker compose run --rm -T lyntty-relay migrate </dev/null
          docker compose run --rm -T lyntty-relay doctor </dev/null
          docker compose up -d lyntty-relay
          deadline=$((SECONDS + 90))
          until curl -fsS http://127.0.0.1:3005/health >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo 'Relay health check timed out' >&2
              false
            fi
            sleep 1
          done
          verify_running_release
          curl -fsS https://relay.jczhang.cc/health >/dev/null
          external_response="$(curl -fsS -X POST https://relay.jczhang.cc/v1/version \
            -H 'Content-Type: application/json' \
            --data '{"platform":"android","version":"0.0.0","version_code":0,"app_id":"dev.jczhang.lyntty","release_channel":"stable"}')"
          jq -e --arg release "$BOM_TAG" --arg bom_sha "$BOM_SHA256" --argjson sequence "$BOM_SEQUENCE" \
            '.update_required == true and .bom_release_id == $release and .bom_sequence == $sequence and .bom_sha256 == $bom_sha' \
            <<< "$external_response" >/dev/null
          printf '%s %s\n' "$BOM_TAG" "$IMAGE_REFERENCE" > deployed-bom.txt
          printf '%s\n' "$BOM_SEQUENCE" > deployed-sequence.txt
          printf '%s %s %s %s %s %s %s %s\n' "$BOM_TAG" "$IMAGE_REFERENCE" "$SOURCE_COMMIT" "$RELAY_SOURCE_COMMIT" "$RELAY_VERSION" "$BOM_SHA256" "$TRUST_ROOTS_SHA256" "$APK_SHA256" > deployed-release.txt
          chmod 600 deployed-bom.txt deployed-sequence.txt deployed-release.txt
          success=true
          rm -f "$incomplete_marker"
          remove_private_file "$previous_env"
          trap - EXIT HUP INT TERM
          docker compose ps
          REMOTE

      - name: Verify public Relay serves the deployed signed BOM
        env:
          BOM_SEQUENCE: ${{ steps.release.outputs.sequence }}
          BOM_SHA256: ${{ steps.release.outputs.bom_sha256 }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
          APK_SHA256: ${{ steps.release.outputs.apk_sha256 }}
          APK_VERSION_CODE: ${{ steps.release.outputs.apk_version_code }}
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST https://relay.jczhang.cc/v1/version \
            -H 'Content-Type: application/json' \
            --data '{"platform":"android","version":"0.0.0","version_code":0,"app_id":"dev.jczhang.lyntty","release_channel":"stable"}')"
          jq -e --arg release "$BOM_TAG" --arg url "$APK_URL" --arg sha "$APK_SHA256" \
            --arg bom_sha "$BOM_SHA256" --argjson sequence "$BOM_SEQUENCE" --argjson code "$APK_VERSION_CODE" \
            '.update_required == true and .release_channel == "stable" and .bom_release_id == $release and .bom_sequence == $sequence and .bom_sha256 == $bom_sha and .version_code == $code and .apk_url == $url and .sha256 == $sha' \
            <<< "$response" >/dev/null
