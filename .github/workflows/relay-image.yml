name: Relay image verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Relay image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/jczhang02/lyntty-relay:verify-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jczhang02/lyntty
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=lyntty-relay

# GHCR publication belongs to the compatibility-BOM release workflow. A stable
# component release must not publish from an ordinary push to main.
