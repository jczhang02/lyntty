name: Relay image

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - packages/lyntty-relay/**
      - packages/lyntty-wire/**
      - .github/workflows/relay-image.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - packages/lyntty-relay/**
      - packages/lyntty-wire/**
      - .github/workflows/relay-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/jczhang02/lyntty-relay:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/jczhang02/lyntty-relay:main
          labels: |
            org.opencontainers.image.source=https://github.com/jczhang02/lyntty
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=lyntty-relay
