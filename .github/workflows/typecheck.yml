name: Lyntty CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install deterministic dependencies
        run: bun install --frozen-lockfile
      - name: Verify lifecycle-script trust
        run: |
          set -euo pipefail
          untrusted="$(bun pm untrusted 2>&1)"
          grep -Fq 'Found 0 untrusted dependencies with scripts.' <<< "$untrusted"
      - name: Check repository and release hardening
        run: |
          bun run test:repo-hardening
          bun test scripts/release.test.ts scripts/github-release.test.ts scripts/relay-oci-sbom.test.ts packages/lyntty-cli/scripts/build-artifact.test.ts
      - name: Install docs toolchain
        working-directory: docs/.site
        run: bun install --frozen-lockfile
      - name: Verify docs lifecycle-script trust
        working-directory: docs/.site
        run: |
          set -euo pipefail
          untrusted="$(bun pm untrusted 2>&1)"
          grep -Fq 'Found 0 untrusted dependencies with scripts.' <<< "$untrusted"
      - name: Check and build complete docs site
        working-directory: docs/.site
        run: |
          bun run docs:audit
          bun run docs:check
          bun run docs:build
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

  wire:
    name: lyntty-wire
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun run ci:audit
      - name: Build and test lyntty-wire
        run: bun run ci:wire

  cli:
    name: lyntty-cli
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and test lyntty-cli
        run: bun run ci:cli
      - name: Exercise compiled CLI and daemon against isolated Relay
        run: bun run ci:daemon-integration

  relay:
    name: lyntty-relay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, build, and test lyntty-relay
        run: bun run ci:relay

  app:
    name: lyntty-app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, lint, test, and inspect Expo config
        run: bun run ci:app

  dev-isolation:
    name: isolated dev lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install flock on macOS
        if: runner.os == 'macOS'
        run: brew install flock
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Exercise isolated development lifecycle
        run: bun run ci:dev
