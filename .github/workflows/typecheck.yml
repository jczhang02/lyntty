name: Lyntty CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build lyntty-wire
              run: pnpm --filter ./packages/lyntty-wire build

            - name: Test lyntty-wire
              run: pnpm --filter ./packages/lyntty-wire test

            - name: Typecheck lyntty-cli
              run: pnpm --filter ./packages/lyntty-cli typecheck

            - name: Test lyntty-cli
              run: pnpm --filter ./packages/lyntty-cli test

            - name: Typecheck lyntty-relay
              run: pnpm --filter ./packages/lyntty-relay typecheck

            - name: Test lyntty-relay
              run: pnpm --filter ./packages/lyntty-relay test

            - name: Typecheck lyntty-app
              run: pnpm --filter ./packages/lyntty-app typecheck

            - name: Test lyntty-app
              run: pnpm --filter ./packages/lyntty-app test

            - name: Check whitespace
              run: git diff --check
