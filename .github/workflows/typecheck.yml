          bun-version: 1.3.14
      - name: Classify CI scope
        id: scope
        env:
          LYNTTY_CI_EVENT_NAME: ${{ github.event_name }}
          LYNTTY_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LYNTTY_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LYNTTY_CI_EVENT_NAME" != "pull_request" ]]; then
            printf 'run_full=true\nreason=non-pr-event\n' >> "$GITHUB_OUTPUT"
          elif [[ ! "$LYNTTY_CI_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
