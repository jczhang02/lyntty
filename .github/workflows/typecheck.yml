name: Lyntty CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install deterministic dependencies
        run: bun install --frozen-lockfile
      - name: Verify lifecycle-script trust
        run: |
          set -euo pipefail
          untrusted="$(bun pm untrusted 2>&1)"
          grep -Fq 'Found 0 untrusted dependencies with scripts.' <<< "$untrusted"
      - name: Check repository and release hardening
        run: |
          bun run test:repo-hardening
          bun test scripts/release.test.ts scripts/github-release.test.ts scripts/relay-oci-sbom.test.ts packages/lyntty-cli/scripts/build-artifact.test.ts
      - name: Install docs toolchain
        working-directory: docs/.site
        run: bun install --frozen-lockfile
      - name: Verify docs lifecycle-script trust
        working-directory: docs/.site
        run: |
          set -euo pipefail
          untrusted="$(bun pm untrusted 2>&1)"
          grep -Fq 'Found 0 untrusted dependencies with scripts.' <<< "$untrusted"
      - name: Check and build complete docs site
        working-directory: docs/.site
        run: |
          bun run docs:audit
          bun run docs:check
          bun run docs:build
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

  wire:
    name: lyntty-wire
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Classify CI scope
        id: scope
        env:
          LYNTTY_CI_EVENT_NAME: ${{ github.event_name }}
          LYNTTY_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LYNTTY_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LYNTTY_CI_EVENT_NAME" != "pull_request" ]]; then
            printf 'run_full=true\nreason=non-pr-event\n' >> "$GITHUB_OUTPUT"
          elif [[ ! "$LYNTTY_CI_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'run_full=true\nreason=invalid-sha\n' >> "$GITHUB_OUTPUT"
          else
            trusted_classifier=".git/lyntty-ci-changed-paths.base.ts"
            classifier_output=".git/lyntty-ci-changed-paths.base.output"
            trusted_bunfig=".git/lyntty-ci-empty-bunfig.toml"
            : > "$trusted_bunfig"
            trap 'rm -f "$trusted_classifier" "$classifier_output" "$trusted_bunfig"' EXIT
            if git show "$LYNTTY_CI_BASE_SHA:scripts/ci-changed-paths.ts" > "$trusted_classifier" 2>/dev/null; then
              : > "$classifier_output"
              if GITHUB_OUTPUT="$classifier_output" bun --config="$trusted_bunfig" --no-env-file --no-install "$trusted_classifier"; then
                if CLASSIFIER_OUTPUT="$classifier_output" bun --config="$trusted_bunfig" --no-env-file --no-install -e '
                  const bytes = new Uint8Array(await Bun.file(process.env.CLASSIFIER_OUTPUT).arrayBuffer());
                  if (bytes.some((byte) => byte > 0x7f)) process.exit(1);
                  let text;
                  try { text = new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(bytes); } catch { process.exit(1); }
                  const lines = text.split("\n");
                  if (lines.length !== 3 || lines[2] !== "" || !/^run_full=(true|false)$/.test(lines[0]) || !/^reason=[a-z0-9-]+$/.test(lines[1])) process.exit(1);
                  if ((lines[0] === "run_full=false") !== (lines[1] === "reason=docs-only")) process.exit(1);
                '; then
                  cat "$classifier_output" >> "$GITHUB_OUTPUT"
                else
                  printf 'run_full=true\nreason=trusted-classifier-invalid\n' >> "$GITHUB_OUTPUT"
                fi
              else
                printf 'run_full=true\nreason=trusted-classifier-failed\n' >> "$GITHUB_OUTPUT"
              fi
            else
              printf 'run_full=true\nreason=trusted-classifier-unavailable\n' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Install dependencies
        if: steps.scope.outputs.run_full == 'true'
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        if: steps.scope.outputs.run_full == 'true'
        run: bun run ci:audit
      - name: Build and test lyntty-wire
        if: steps.scope.outputs.run_full == 'true'
        run: bun run ci:wire

  cli:
    name: lyntty-cli
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
