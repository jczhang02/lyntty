        if: steps.scope.outputs.run_full == 'true'
        run: bun run ci:app

  dev-isolation:
    name: isolated dev lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Classify CI scope
        id: scope
        env:
          LYNTTY_CI_EVENT_NAME: ${{ github.event_name }}
          LYNTTY_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LYNTTY_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
