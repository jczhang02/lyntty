          else
            trusted_classifier=".git/lyntty-ci-changed-paths.base.ts"
            classifier_output=".git/lyntty-ci-changed-paths.base.output"
            trusted_bunfig=".git/lyntty-ci-empty-bunfig.toml"
            : > "$trusted_bunfig"
            trap 'rm -f "$trusted_classifier" "$classifier_output" "$trusted_bunfig"' EXIT
            if git show "$LYNTTY_CI_BASE_SHA:scripts/ci-changed-paths.ts" > "$trusted_classifier" 2>/dev/null; then
