name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Human version name, e.g. 1.0.0
        required: true
        type: string
      version_code:
        description: Optional Android versionCode. Defaults to GitHub run number.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production-android
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate release source
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Android releases must run from refs/heads/main"
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "Android release HEAD must equal origin/main"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install process audit tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace

      - name: Prepare release metadata
        id: release
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version_name must be strict SemVer (for example 1.2.3)"
            exit 1
          fi
          version_code="${VERSION_CODE_INPUT:-$GITHUB_RUN_NUMBER}"
          case "$version_code" in
            ''|*[!0-9]*)
              echo "version_code must be numeric"
              exit 1
              ;;
          esac
          tag="android-v${VERSION_NAME}-${version_code}"
          apk_name="lyntty-android-v${VERSION_NAME}-${version_code}.apk"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          VERSION_CODE="$version_code" bun - <<'BUN'
          const fs = require('node:fs');

          const changelog = fs.readFileSync('packages/lyntty-app/CHANGELOG.md', 'utf8');
          const match = changelog.match(/^# (.+)\n\n([\s\S]*?)(?=\n# |\s*$)/);
          if (!match) {
            throw new Error('CHANGELOG.md must start with a fixed Lyntty Android release entry');
          }

          const [, title, body] = match;
          const expectedTitle = `Lyntty Android ${process.env.VERSION_NAME} (${process.env.VERSION_CODE})`;
          const titlePattern = new RegExp(`^${expectedTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} — \\d{4}-\\d{2}-\\d{2}$`);
          if (!titlePattern.test(title)) {
            throw new Error(`Top changelog title must be "${expectedTitle} — YYYY-MM-DD"; got "${title}"`);
          }

          const summary = body.split('\n').map((line) => line.trim()).find((line) => line && !line.startsWith('#') && !line.startsWith('-'));
          if (!summary) {
            throw new Error('Top changelog entry must include a one-line summary before sections');
          }

          const notes = `# ${title}\n\n${body.trim()}\n`;
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.txt`, notes);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-summary.txt`, `${summary}\n`);
          BUN

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LYNTTY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?LYNTTY_ANDROID_KEYSTORE_BASE64 is required}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lyntty-release.jks"
          chmod 600 "$RUNNER_TEMP/lyntty-release.jks"

      - name: Decode Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.LYNTTY_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?LYNTTY_GOOGLE_SERVICES_JSON_BASE64 is required for Android push notifications}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > packages/lyntty-app/google-services.json
          cp packages/lyntty-app/google-services.json packages/lyntty-app/android/app/google-services.json
          chmod 600 packages/lyntty-app/google-services.json packages/lyntty-app/android/app/google-services.json

      - name: Verify production task guard
        working-directory: packages/lyntty-app/android
        run: ../scripts/gradle-production-guard-test.sh "$RUNNER_TEMP/android-production-guard.txt"

      - name: Build signed production APK
        working-directory: packages/lyntty-app/android
        env:
          APP_ENV: production
          LYNTTY_BUILD_COMMIT_SHA: ${{ github.sha }}
          LYNTTY_EXPO_PROJECT_ID: ${{ vars.LYNTTY_EXPO_PROJECT_ID }}
          LYNTTY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LYNTTY_ANDROID_KEYSTORE_PASSWORD }}
          LYNTTY_ANDROID_KEY_ALIAS: ${{ secrets.LYNTTY_ANDROID_KEY_ALIAS }}
          LYNTTY_ANDROID_KEY_PASSWORD: ${{ secrets.LYNTTY_ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          : "${LYNTTY_EXPO_PROJECT_ID:?Repository variable LYNTTY_EXPO_PROJECT_ID is required for Expo push tokens}"
          [[ "$LYNTTY_EXPO_PROJECT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]] || {
            echo 'LYNTTY_EXPO_PROJECT_ID must be a UUID' >&2
            exit 1
          }
          ../scripts/gradle-runtime-audit.sh "$RUNNER_TEMP/android-exec-audit.txt" -- \
            ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2 \
              -x lintVitalAnalyzeRelease \
              -x lintVitalRelease \
              -PreactNativeArchitectures=arm64-v8a \
              -Pandroid.enablePngCrunchInReleaseBuilds=false \
              -PlynttyVersionName="$VERSION_NAME" \
              -PlynttyVersionCode="$VERSION_CODE" \
              -PlynttyKeystoreFile="$RUNNER_TEMP/lyntty-release.jks"

      - name: Verify signed production APK
        env:
          EXPECTED_CERT_SHA256: ${{ vars.LYNTTY_ANDROID_CERT_SHA256 }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          : "${EXPECTED_CERT_SHA256:?Production environment variable LYNTTY_ANDROID_CERT_SHA256 is required}"
          packages/lyntty-app/scripts/apk-audit.sh \
            packages/lyntty-app/android/app/build/outputs/apk/release/app-release.apk \
            dev.jczhang.lyntty "$VERSION_NAME" "$VERSION_CODE" "$EXPECTED_CERT_SHA256" \
            > "$RUNNER_TEMP/android-apk-audit.txt"

      - name: Generate latest.json
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          TAG: ${{ steps.release.outputs.tag }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          set -euo pipefail
          apk_source="packages/lyntty-app/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_source"
          cp "$apk_source" "$RUNNER_TEMP/$APK_NAME"
          export SHA256
          SHA256=$(sha256sum "$RUNNER_TEMP/$APK_NAME" | awk '{print $1}')
          export APK_URL="https://github.com/jczhang02/lyntty/releases/download/${TAG}/${APK_NAME}"
          export MANIFEST_PATH="$RUNNER_TEMP/latest.json"
          bun - <<'BUN'
          const fs = require('node:fs');
          const notes = fs.readFileSync(`${process.env.RUNNER_TEMP}/release-summary.txt`, 'utf8').trim();
          const manifest = {
            platform: 'android',
            appId: 'dev.jczhang.lyntty',
            releaseChannel: 'stable',
            versionName: process.env.VERSION_NAME,
            versionCode: Number(process.env.VERSION_CODE),
            apkUrl: process.env.APK_URL,
            sha256: process.env.SHA256,
            notes,
            publishedAt: new Date().toISOString(),
          };
          fs.writeFileSync(process.env.MANIFEST_PATH, `${JSON.stringify(manifest, null, 2)}\n`);
          BUN

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$RUNNER_TEMP/$APK_NAME" \
            "$RUNNER_TEMP/latest.json" \
            "$RUNNER_TEMP/android-exec-audit.txt" \
            "$RUNNER_TEMP/android-apk-audit.txt" \
            "$RUNNER_TEMP/android-production-guard.txt" \
            --title "Lyntty Android $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"
