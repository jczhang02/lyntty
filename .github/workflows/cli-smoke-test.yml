name: CLI Smoke Test

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: cli-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-noop:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "CLI smoke is manual; push event intentionally no-ops."

  smoke-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile CLI and daemon
        run: |
          mkdir -p build/cli-smoke
          bun build --compile packages/lyntty-cli/src/index.ts --outfile build/cli-smoke/lyntty
          bun build --compile packages/lyntty-cli/src/daemon/entry.ts --outfile build/cli-smoke/lynttyd
      - name: Exercise standalone binaries
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/lyntty-smoke-home"
          export LYNTTY_HOME_DIR="$RUNNER_TEMP/lyntty-smoke-state"
          mkdir -p "$HOME" "$LYNTTY_HOME_DIR"
          build/cli-smoke/lyntty --help
          build/cli-smoke/lyntty --version
          build/cli-smoke/lyntty doctor
          build/cli-smoke/lyntty daemon status
          build/cli-smoke/lyntty remote install
          build/cli-smoke/lynttyd --version
          test -s "$HOME/.pi/agent/extensions/lyntty/index.ts"

  smoke-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile CLI and daemon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/cli-smoke | Out-Null
          bun build --compile packages/lyntty-cli/src/index.ts --outfile build/cli-smoke/lyntty.exe
          bun build --compile packages/lyntty-cli/src/daemon/entry.ts --outfile build/cli-smoke/lynttyd.exe
      - name: Exercise standalone binaries
        shell: pwsh
        run: |
          $env:HOME = "$env:RUNNER_TEMP/lyntty-smoke-home"
          $env:LYNTTY_HOME_DIR = "$env:RUNNER_TEMP/lyntty-smoke-state"
          New-Item -ItemType Directory -Force $env:HOME, $env:LYNTTY_HOME_DIR | Out-Null
          & build/cli-smoke/lyntty.exe --help
          & build/cli-smoke/lyntty.exe --version
          & build/cli-smoke/lyntty.exe doctor
          & build/cli-smoke/lyntty.exe daemon status
          & build/cli-smoke/lyntty.exe remote install
          & build/cli-smoke/lynttyd.exe --version
          if (-not (Test-Path "$env:HOME/.pi/agent/extensions/lyntty/index.ts")) { throw 'Pi extension was not installed' }
