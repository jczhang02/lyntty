name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CONTEXT-MAP.md"
      - "CONTRIBUTING*.md"
      - "PRIVACY*.md"
      - "SECURITY*.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs/.site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install docs toolchain
        run: bun install --frozen-lockfile
      - name: Verify docs lifecycle-script trust
        run: |
          set -euo pipefail
          untrusted="$(bun pm untrusted 2>&1)"
          grep -Fq 'Found 0 untrusted dependencies with scripts.' <<< "$untrusted"
      - name: Audit docs dependencies
        run: bun run docs:audit
      - name: Check Fumadocs site
        run: bun run docs:check
      - name: Build Fumadocs site
        run: bun run docs:build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
