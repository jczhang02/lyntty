name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CONTEXT-MAP.md"
      - "astro.config.mjs"
      - "src/content.config.ts"
      - "scripts/prepare-starlight-pages.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install docs toolchain
        run: npm ci

      - name: Check Starlight docs
        run: npm run docs:check

      - name: Build Starlight site
        run: npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
