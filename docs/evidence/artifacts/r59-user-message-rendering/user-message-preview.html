<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyntty user message rendering preview</title>
<style>
body{margin:0;background:#faf9f5;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717}.phone{width:390px;min-height:760px;margin:24px auto;background:#fff;border:1px solid #ddd6c9;border-radius:28px;padding:22px 16px;box-shadow:0 18px 48px rgba(0,0,0,.12)}.row{display:flex;flex-direction:column;margin:18px 0}.right{align-items:flex-end}.computer{align-items:stretch}.label{font-size:12px;color:#777068;margin:0 4px 4px}.bubble{background:#f1efe8;border-radius:18px;padding:8px 12px;max-width:100%}.phone-card{width:88%;min-width:56%;border:1px solid #ded9cf;border-radius:20px}.computer-card{width:100%;box-sizing:border-box;background:#f5f3ee;border:1px solid #ded9cf;border-radius:20px}.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}.bubble ol,.bubble ul{margin:0;padding:0;list-style:none}.bubble li{display:flex;gap:8px;margin:6px 0}.marker{width:34px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}.body{min-width:0;flex:1}.chip{display:inline-block;background:#ebe7dd;border-radius:10px;padding:3px 10px;font:13px/1.4 ui-monospace,SFMono-Regular,monospace;opacity:.72}
</style></head><body><main class="phone">
<div class="row computer"><div class="label">Computer Pi</div><div class="bubble computer-card"><ol><li><span class="marker">1.</span><span class="body">first visible body from computer-side Pi</span></li><li><span class="marker">2.</span><span class="body">second visible body stays readable in the same card</span></li></ol><p>/skill:jc-writing-style</p></div></div>
<div class="row right"><div class="bubble phone-card"><ol><li><span class="marker">1.</span><span class="body">phone long prompt item</span></li><li><span class="marker">2.</span><span class="body">phone long prompt item wraps normally</span></li></ol></div></div>
<div class="row right"><div class="bubble"><span class="chip">/skill:jc-writing-style</span></div></div>
</main></body></html>
